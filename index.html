  <style>
    :root{color-scheme:dark;--bg:#0d111b;--panel:#151b2a;--panel-2:#1b2335;--ink:#f1f0eb;--muted:#a4a9b6;--line:#30384b;--gold:#dfc98e;--gold-dim:#a89158;--indigo:#262e4c;--shadow:0 24px 80px #0008;--radius:24px;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;background:radial-gradient(ellipse at 50% 4%,#34395888 0,transparent 44%),var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px 12px}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}

    #app{flex:1;overflow:auto;overscroll-behavior:contain;padding:22px 20px 24px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;animation:appear .2s ease-out}.bottomnav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid color-mix(in srgb,var(--line),transparent 35%);background:color-mix(in srgb,var(--bg),transparent 5%)}.navlink{min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:16px;color:var(--muted);font-size:13px;transition:background .18s,color .18s}.navlink .navicon{font-size:16px}.navlink[aria-current="page"]{background:var(--panel-2);color:var(--gold);font-weight:700}
    @keyframes appear{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .eyebrow{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 8px}.page-title{font-size:27px;line-height:1.15;letter-spacing:-.035em;margin:0 0 8px}.page-subtitle{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:24px 0 12px}.section-head h2{font-size:15px;letter-spacing:.03em;margin:0}.small-link{color:var(--gold);font-size:12px;text-decoration:none;white-space:nowrap}.hero{margin-top:12px;padding:24px 20px 20px;border:1px solid #8d835355;border-radius:var(--radius);background:linear-gradient(135deg,#222942,var(--panel) 60%,#171d2c);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-32px;top:-56px;width:150px;height:210px;border:1px solid #e2d5a126;transform:rotate(28deg);clip-path:polygon(50% 0,100% 100%,50% 79%,0 100%);background:linear-gradient(160deg,#d8c48a12,transparent)}:root[data-theme="light"] .hero{background:linear-gradient(135deg,#dfe3f1,var(--panel) 65%,#f5f1e5)}
    .clock-time{font-variant-numeric:tabular-nums;letter-spacing:-.065em;font-size:clamp(52px,16vw,76px);font-weight:300;line-height:1.05;margin:7px 0 9px;position:relative;z-index:1}.clock-date{font-size:13px;color:var(--muted);position:relative;z-index:1}.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:14px;border-top:1px solid #ffffff16;position:relative;z-index:1;color:var(--muted);font-size:11px;letter-spacing:.09em}.hero-foot strong{color:var(--gold);font-size:10px;letter-spacing:.14em;font-weight:650}

    .list{display:grid;gap:10px;margin-top:22px}.list-item{min-height:72px;display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(135deg,var(--panel-2),var(--panel));text-decoration:none;transition:border-color .18s,transform .18s}.list-item:hover,.list-item:focus-visible{border-color:var(--gold-dim);transform:translateY(-1px);outline:none}.list-icon{width:42px;height:42px;flex:none;overflow:hidden;border-radius:15px;background:#dfc98e16;color:var(--gold);display:grid;place-items:center;font-size:21px}.list-icon img{display:block;width:100%;height:100%;object-fit:cover}.list-copy{flex:1;min-width:0}.list-title{font-size:14px;font-weight:650}.list-desc{font-size:11px;color:var(--muted);margin-top:4px}.chevron{color:var(--muted);font-size:20px}
    .panel{padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--panel);margin-top:18px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0;padding-bottom:0}.setting-row:first-child{padding-top:0}.setting-label{font-size:14px;font-weight:600}.setting-hint{color:var(--muted);font-size:11px;line-height:1.5;margin-top:4px}.segmented{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:13px;background:var(--bg)}.segmented button{border:0;border-radius:10px;background:transparent;color:var(--muted);padding:8px 11px;font-size:11px}.segmented button[aria-pressed="true"]{background:var(--indigo);color:var(--gold);font-weight:700}.danger{min-height:46px;padding:0 15px;border:1px solid #aa6c6c77;border-radius:14px;background:#9d49491a;color:#e7aaaa;font-size:13px;font-weight:650}.empty-state{margin-top:26px;padding:28px 20px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(135deg,var(--panel-2),var(--panel));text-align:center}.empty-icon{font-size:34px;color:var(--gold);margin-bottom:14px}.empty-state h2{font-size:18px;margin:0 0 8px}.empty-state p{font-size:13px;line-height:1.7;color:var(--muted);margin:0}.primary-link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;margin-top:18px;border:1px solid var(--gold-dim);border-radius:15px;background:linear-gradient(135deg,#dac788,#b6a369);color:#211f18;font-weight:750;font-size:13px;text-decoration:none}.clock-panel{margin-top:24px;padding:26px 18px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(155deg,var(--panel-2),var(--panel));text-align:center}.clock-panel .clock-time{font-size:clamp(58px,18vw,82px)}.backlink{display:inline-flex;align-items:center;gap:7px;margin:0 0 18px;color:var(--muted);font-size:12px;text-decoration:none}.backlink:hover{color:var(--gold)}.fo     @media(max-width:480px){body{padding:0;background:var(--bg)}.phone{width:100%;height:100dvh;min-height:560px;border:0;border-radius:0;box-shadow:none}.topbar{padding-top:calc(13px + env(safe-area-inset-top))}#app{padding-inline:18px}.bottomnav{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}
    @media(max-height:710px) and (min-width:481px){.phone{min-height:0;height:calc(100dvh - 24px)}body{padding:12px}.hero{padding-top:16px;padding-bottom:14px}.app-card{min-height:96px}}

    .bj-stack{display:grid;gap:14px;margin-top:18px}.bj-panel{padding:16px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--panel-2),var(--panel) 72%)}.bj-panel h2{font-size:15px;margin:0 0 12px}.bj-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bj-field{display:grid;gap:6px;color:var(--muted);font-size:11px}.bj-field input,.bj-field select,.bj-bet-input{width:100%;min-height:44px;padding:0 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}.bj-field input:focus,.bj-field select:focus,.bj-bet-input:focus{outline:2px solid var(--gold-dim);outline-offset:1px}.bj-seats{display:grid;gap:10px}.bj-seat{padding:13px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--panel),transparent 8%)}.bj-seat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.bj-seat-title{font-size:12px;color:var(--gold);letter-spacing:.08em}.bj-chipline{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:9px;color:var(--muted);font-size:11px}.bj-chipline strong{color:var(--ink);font-variant-numeric:tabular-nums}.bj-btn{min-height:48px;padding:0 15px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);font-size:13px;font-weight:700}.bj-btn:hover:not(:disabled){border-color:var(--gold-dim)}.bj-btn:disabled{opacity:.48;cursor:not-allowed}.bj-btn-primary{border-color:var(--gold-dim);background:linear-gradient(135deg,#dac788,#b6a369);color:#211f18}.bj-btn-subtle{color:var(--gold)}.bj-btn-danger{color:#e7aaaa;border-color:#aa6c6c77;background:#9d49491a}.bj-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.bj-note{font-size:11px;line-height:1.6;color:var(--muted);margin:8px 0 0}.bj-rule-copy{white-space:pre-line;color:var(--muted);font-size:12px;line-height:1.75}.bj-modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#0     /* Blackjack: use the whole viewport as a compact, readable game table. */
    body.bj-mode{padding:0;place-items:stretch}
    body.bj-mode .phone{width:100%;max-width:none;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}
    .phone.bj-mode .topbar{min-height:54px;padding:8px 16px}
    .phone.bj-mode #app{overflow:hidden;padding:9px 12px 12px;display:flex;flex-direction:column;animation:none}
    .phone.bj-mode .bottomnav{display:none}
    .bj-screen{height:100%;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
    .bj-screen-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;min-height:38px}
    .bj-screen-heading{min-width:0}.bj-screen-heading .eyebrow{font-size:9px;margin:0 0 2px;letter-spacing:.14em}
    .bj-screen-heading h1{font-size:clamp(17px,4.5vw,22px);line-height:1.1;letter-spacing:-.025em;margin:0}
    .bj-back{font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
    .bj-head-button{min-height:42px;padding:0 11px;font-size:11px;white-space:nowrap}
    .bj-screen-hint{flex:none;margin:0;color:var(--muted);font-size:11px;line-height:1.35}
    .bj-setup-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
    .bj-setup-controls .bj-field{gap:4px;font-size:10px}.bj-setup-controls select{min-height:40px}
    .bj-setup-label{font-size:11px;color:var(--gold);letter-spacing:.08em;flex:none;margin-top:1px}
    .bj-setup-seats,.bj-bet-grid,.bj-janken-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;min-height:0;align-content:stretch}
    .bj-setup-seats{flex:1;grid-auto-rows:minmax(0,1fr)}
    .bj-setup-seat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:center;gap:5px;padding:7px 8px;min-height:0;overflow:hidden}
    .bj-setup-seat .bj-seat-head{grid-column:1/-1;margin:0;min-height:18px}.bj-setup-seat .bj-field{gap:3px;font-size:9px}
    .bj-setup-seat .bj-field input,.bj-setup-seat .bj-field select{min-height:34px;padding:0 8px;font-size:12px;border-radius:9px}
    .bj-start{flex:none;min-height:48px}
    .bj-bet-screen .bj-screen-hint{margin-top:-2px}
    .bj-bet-grid{flex:1;grid-auto-rows:minmax(0,1fr)}
    .bj-bet-card{min-height:0;padding:8px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,var(--panel-2),var(--panel) 75%);display:flex;flex-direction:column;justify-content:space-between;gap:4px;overflow:hidden}
    .bj-bet-name{font-size:11px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bj-bet-balance{display:flex;gap:9px;color:var(--muted);font-size:9px;white-space:nowrap}.bj-bet-balance strong{color:var(--ink);font-variant-numeric:tabular-nums}
    .bj-wager{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:7px;color:var(--muted);font-size:10px;min-width:0}
    .bj-wager .bj-bet-input{width:84px;min-height:42px;padding:0 9px;font-size:16px;font-weight:750;text-align:center;border-color:var(--gold-dim)}
    .bj-auto-wager{display:grid;place-items:center;min-width:54px;min-height:38px;padding:0 10px;border-radius:10px;background:var(--indigo);color:var(--gold);font-size:17px;font-variant-numeric:tabular-nums}
    .bj-deal{flex:none;min-height:52px;font-size:14px}
    .bj-error{color:#e99c9c;margin:0}
    .bj-player-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:7px;flex:1;min-height:0;align-content:stretch}
    .bj-player{min-width:0;min-height:0;padding:7px 8px;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;gap:3px;overflow:hidden}
    .bj-player-top{align-items:center;min-height:17px;gap:5px}.bj-player-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;line-height:1.2}
    .bj-player-name .bj-role-tag{padding:2px 5px;font-size:8px;margin-left:3px;vertical-align:1px}
    .bj-state{font-size:9px;letter-spacing:-.02em}
    .bj-score-row{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:32px;flex:1;min-width:0}
    .bj-cards{display:flex;flex-wrap:wrap;align-content:center;align-items:center;gap:2px;min-width:0;min-height:30px;max-height:64px;overflow:hidden;margin:0;flex:1}
    .bj-card{width:22px;height:29px;flex:none;border-radius:5px;box-shadow:0 1px 3px #0004}.bj-card-rank{font-size:11px}.bj-card-suit{font-size:10px;margin-top:1px}
    .bj-total{margin:0;flex:none;display:grid;place-items:center;min-width:32px;height:30px;padding:0 5px;border-radius:9px;background:color-mix(in srgb,var(--gold),transparent 87%);color:var(--gold);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
    .bj-chipline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:0;color:var(--muted);font-size:8px;line-height:1.15;white-space:nowrap}
    .bj-chipline span{overflow:hidden;text-overflow:ellipsis}.bj-chipline b{color:var(--ink);font-size:10px;font-variant-numeric:tabular-nums}

const aiState={mode:1,busy:false,search:false,remember:false,setupOpen:false,notice:"",setupMsg:"",display:[],hist:[]};
function aiGetKey(){try{const v=sessionStorage.getItem(AI_KEY_STORE);if(v)return{key:v,where:"session"}}catch(_){ }try{const v=localStorage.getItem(AI_KEY_STORE);if(v)return{key:v,where:"local"}}catch(_){ }return{key:"",where:""}}
function aiGetProxy(){try{return localStorage.getItem(AI_PROXY_KEY)||""}catch(_){return ""}}
function aiLoadMode(){aiState.hist=[];aiState.display=[];try{const s=JSON.parse(localStorage.getItem(AI_HIST_PREFIX+aiState.mode)||"null");if(s&&Array.isArray(s.hist)){aiState.hist=s.hist.filter(m=>m&&(m.role==="user"||m.role==="model")&&typeof m.text==="string").slice(-50).map(m=>({role:m.role,text:m.text.slice(0,8000)}));aiState.display=aiState.hist.map(m=>({who:m.role==="user"?"me":"ai",text:m.text}))}}catch(_){ }}

async function aiSend(){
  if(aiState.busy)return;
  const ta=document.getElementById("aiMsg"),text=(ta?ta.value:"").trim().slice(0,4000);
  if(!text)return;
  const proxy=aiGetProxy(),keyInfo=aiGetKey();
  if(!proxy&&!keyInfo.key){aiState.notice=t("aiNeedSetup");aiState.setupOpen=true;render();return}
  aiState.notice="";aiState.busy=true;
  aiState.hist.push({role:"user",text});if(aiState.hist.length>50)aiState.hist.splice(0,aiState.hist.length-50);
  aiState.display.push({who:"me",text},{who:"ai",text:"…"});aiSaveHist();aiRenderNow();
  const body={contents:aiState.hist.map(m=>({role:m.role,parts:[{text:m.text}]}))};
  if(aiState.search)body.tools=[{google_search:{}}];
  const sys=AI_PROMPTS[aiState.mode];if(sys)body.systemInstruction={parts:[{text:sys}]};
  try{
    const r=await fetch(proxy||`https://generativelanguage.googleapis.com/v1beta/models/${AI_MODEL}:generateContent`,{method:"POST",headers:proxy?{"content-type":"application/json"}:{"content-type":"application/json","x-goog-api-key":keyInfo.key},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>null);
    let answer=d?.candidates?.[0]?.content?.parts?.map(p=>p.text||"").join("")||"";
    if(!answer)throw new Error(d?.error?.message?String(d.error.message).slice(0,300):"HTTP "+r.status);
    const src=[...new Set((d?.candidates?.[0]?.groundingMetadata?.groundingChunks||[]).map(c=>c?.web?.title).filter(Boolean))];
    if(src.length)answer+="\n\n"+t("aiSources")+": "+src.join(" / ");
    aiState.display[aiState.display.length-1]={who:"ai",text:answer};
    aiState.hist.push({role:"model",text:answer});aiSaveHist();
    aiBumpUsage(d?.usageMetadata?.totalTokenCount);
  }catch(e){
    aiState.display[aiState.display.length-1]={who:"err",text:t("aiError")+": "+(e?.message||String(e))};
    aiBumpUsage(0);
  }
  aiState.busy=false;aiRenderNow();
}
function aiAction(action){

  if(action==="clear-key"){try{sessionStorage.removeItem(AI_KEY_STORE);localStorage.removeItem(AI_KEY_STORE)}catch(_){ }aiState.setupMsg=t("aiKeyCleared");render();return}

function renderBJPlayer(p,i,current){const isCurrent=i===current,busted=p.status==="busted"||bjTotal(p)>21;return `<article class="bj-player" data-current="${isCurrent}" data-busted="${busted}"><div class="bj-player-top"><span class="bj-player-name">${bjPlayerLabel(p)}</span><span class="bj-state${busted?" bj-state-busted":""}">${esc(t(bjStatusKey(p,isCurrent)))}</span></div><div class="bj-score-row"><div class="bj-cards">${p.hand.map(bjCardHtml).join("")||`<span class="bj-zero">—</span>`}</div><span class="bj-total">${bjTotal(p)}</span></div><div class="bj-chipline"><span><b>${p.chips}</b> ${esc(t("bjChips"))}</span><span><b>${p.debt}</b> ${esc(t("bjDebt"))}</span><span><b>${p.bet}</b> ${esc(t("bjBet"))}</span></div></article>`}
function renderBJTable(){const g=bjGame,p=g.players[g.currentIndex],cpu=p&&!p.human;return `<div class="bj-screen bj-play-screen"><header class="bj-screen-head"><div class="bj-screen-heading"><p class="eyebrow">${esc(t("bjTitle"))}</p><h1>${esc(t("bjRound"))} ${g.round}</h1></div><button type="button" class="bj-btn bj-btn-danger bj-head-button" data-bj="quit">${esc(t("bjQuit"))}</button></header><section class="bj-player-grid">${g.players.map((x,i)=>renderBJPlayer(x,i,g.currentIndex)).join("")}</section>${g.notice?`<p class="bj-note bj-error" role="status">${esc(t(g.notice))}</p>`:""}<section class="bj-action-area"><p class="bj-turn-line"><span>${esc(t(cpu?"bjCpuTurn":"bjTurn"))}</span><strong>${p?esc(p.name):""}</strong></p><div class="bj-actions"><button type="button" class="bj-btn bj-action-hit" data-bj="hit" ${cpu||!p?"disabled":""}>${esc(t("bjHit"))}</button><button type="button" class="bj-btn bj-action-stand" data-bj="stand" ${cpu||!p?"disabled":""}>${esc(t("bjStand"))}</button></div></section></div>`}
function bjJankenPlayer(id){const g=bjGame,p=g.players[id],choice=g.jankenChoices[id],hands=[["rock","bjRock"],["paper","bjPaper"],["scissors","bjScissors"]];return `<section class="bj-janken-player"><div class="bj-janken-title">${esc(p.name)} ${p.human?"":`· ${esc(t("bjCPU"))}`}${!p.human&&choice?` — ${esc(t(choice==="rock"?"bjRock":choice==="paper"?"bjPaper":"bjScissors"))}`:""}</div>${p.human?`<div class="bj-janken-choices">${hands.map(([hand,key])=>`<button type="button" class="bj-btn${choice===hand?" selected":""}" data-bj-janken-player="${id}" data-bj-janken-hand="${hand}" ${choice?"disabled":""}>${esc(t(key))}</button>`).join("")}</div>`:""}</section>`}
function renderBJJanken(){const g=bjGame;return `<div class="bj-screen bj-janken-screen"><header class="bj-screen-head"><div class="bj-screen-heading"><p class="eyebrow">${esc(t("bjJanken"))} · ${esc(t("bjRound"))} ${g.round}</p><h1>${esc(t("bjTitle"))}</h1></div><button type="button" class="bj-btn bj-btn-danger bj-head-button" data-bj="quit">${esc(t("bjQuit"))}</button></header><p class="bj-screen-hint">${esc(t("bjJankenIntro"))} · ${esc(t("bjRemainder"))}: <strong>${g.jankenRemaining}</strong></p>${g.jankenNotice?`<p class="bj-note" role="status">${esc(t(g.jankenNotice))}</p>`:""}<section class="bj-janken-grid">${g.jankenEligible.map(bjJankenPlayer).join("")}</section></div>`}
function renderBJResult(){const g=bjGame,r=g.result,winners=(r?.winnerIds||[]).map(id=>g.players[id].name);return `<div class="bj-screen bj-result-screen"><header class="bj-screen-head"><div class="bj-screen-heading"><p class="eyebrow">${esc(t("bjResult"))} · ${esc(t("bjRound"))} ${g.round}</p><h1>${esc(t("bjTitle"))}</h1></div><button type="button" class="bj-btn bj-btn-danger bj-head-button" data-bj="quit">${esc(t("bjQuit"))}</button></header><section class="bj-result-summary"><p class="bj-result-title">${esc(r?.noContest?t("bjNoContest"):winners.length===1?t("bjWinner"):t("bjWinners"))}${r?.noContest?"":`: ${esc(winners.join(" · "))}`}</p><p class="bj-note">${esc(t(r?.noContest?"bjNoContestText":r?.reason||"bjReasonStand"))}</p><div class="bj-pot-line">${esc(t("bjPot"))} <strong>${r?.pot||0}</strong></div></section><section class="bj-result-list">${g.players.map((p,i)=>{const q=g.payouts[i]||{};return `<div class="bj-payout-row"><span class="bj-payout-label"><strong>${esc(p.name)}</strong> · ${esc(t("bjBet"))} ${p.bet}<small>${esc(t("bjPotShare"))} ${q.potShare||0} + ${esc(t("bjBonus"))} ${q.bonus||0}${q.janken?` + ${esc(t("bjJankenAward"))} ${q.janken}`:""}${q.refund?` · ${esc(t("bjRefund"))} ${q.refund}`:""}${q.repayment?` · ${esc(t("bjRepayment"))} ${q.repayment}`:""}</small></span><span class="bj-payout-value">${esc(t("bjChips"))} ${p.chips}<br>${esc(t("bjDebt"))} ${p.debt}</span></div>`}).join("")}</section><div class="bj-result-actions"><button type="button" class="bj-btn bj-btn-primary" data-bj="next">${esc(t("bjNext"))}</button></div></div>`}
function renderBlackjack(){if(!bjGame)return renderBJSetup();if(bjGame.phase==="betting")return renderBJBetting();if(bjGame.phase==="playing")return renderBJTable();if(bjGame.phase==="janken")return renderBJJanken();return renderBJResult()}
function bjRepay(p){let amount=0;while(p.debt>0&&p.chips>=50){p.chips-=30;p.debt-=30;amount+=30}return amount}
function bjTransfer(g,id,kind,amount){if(amount<=0)return;const p=g.players[id],q=g.payouts[id];p.chips+=amount;q[kind]=(q[kind]||0)+amount;q.repayment=(q.repayment||0)+bjRepay(p)}
function bjFinalizeRound(g){g.players.forEach(p=>g.discard.push(...p.hand));g.phase="result";g.jankenEligible=[];g.jankenChoices={};g.jankenNotice=""}
function bjResolveJankenHands(ids,choices){const used=new Set(ids.map(id=>choices[id]));if(used.size!==2)return [];let winning;if(used.has("rock")&&used.has("scissors"))winning="rock";else if(used.has("paper")&&used.has("rock"))winning="paper";else winning="scissors";return ids.filter(id=>choices[id]===winning)}
function bjRandomJanken(){return bjHands[Math.floor(Math.random()*bjHands.length)]}
function bjBeginJanken(g,eligible,remaining,notice=""){g.phase="janken";g.jankenEligible=eligible.slice();g.jankenRemaining=remaining;g.jankenNotice=notice;g.jankenChoices={};const humans=eligible.filter(id=>g.players[id].human);eligible.filter(id=>!g.players[id].human).forEach(id=>g.jankenChoices[id]=bjRandomJanken());if(!humans.length){let winners=[];for(let tries=0;tries<1000&&!winners.length;tries++){eligible.forEach(id=>g.jankenChoices[id]=bjRandomJanken());winners=bjResolveJankenHands(eligible,g.jankenChoices)}if(!winners.length)winners=[eligible[Math.floor(Math.random()*eligible.length)]];bjApplyJankenWinners(g,winners)}}
function bjApplyJankenWinners(g,winners){const remaining=g.jankenRemaining,eligible=g.jankenEligible.slice();if(winners.length>remaining){bjBeginJanken(g,winners,remaining,"bjJankenNarrow");return}winners.forEach(id=>bjTransfer(g,id,"janken",1));const left=remaining-winners.length,still=eligible.filter(id=>!winners.includes(id));if(left>0&&still.length)bjBeginJanken(g,still,left,"");else bjFinalizeRound(g)}
function bjResolveJanken(g){const winners=bjResolveJankenHands(g.jankenEligible,g.jankenChoices);if(!winners.length){bjBeginJanken(g,g.jankenEligible,g.jankenRemaining,"bjJankenNoWinner");return}bjApplyJankenWinners(g,winners)}
function bjSettleRound(g,reason){if(!g||g.phase==="result"||g.phase==="janken")return;g.phase="settling";const pot=g.players.reduce((sum,p)=>sum+p.bet,0);g.payouts={};g.players.forEach((p,i)=>g.payouts[i]={potShare:0,bonus:0,janken:0,refund:0,repayment:0});const alive=g.players.filter(p=>p.status!=="busted"&&bjTotal(p)<=21);g.result={pot,reason,winnerIds:[],noContest:false};if(!alive.length){g.result.noContest=true;g.players.forEach((p,i)=>{p.chips+=p.bet;g.payouts[i].refund=p.bet;g.payouts[i].repayment=bjRepay(p)});bjFinalizeRound(g);return}const best=Math.max(...alive.map(bjTotal)),winners=alive.filter(p=>bjTotal(p)===best),ids=winners.map(p=>g.players.indexOf(p));g.result.winnerIds=ids;if(winners.length===1){const id=ids[0],bonus=Math.floor(g.players[id].bet*1.5);bjTransfer(g,id,"potShare",pot);bjTransfer(g,id,"bonus",bonus);bjFinalizeRound(g);return}const share=Math.floor(pot/winners.length),remainder=pot%winners.length;ids.forEach(id=>{bjTransfer(g,id,"potShare",share);bjTransfer(g,id,"bonus",Math.floor(g.players[id].bet*1.5))});if(remainder)bjBeginJanken(g,ids,remainder);else bjFinalizeRound(g)}
function bjNextAlive(from){const g=bjGame,n=g.players.length;for(let step=1;step<=n;step++){const i=(from+step)%n;if(g.players[i].status!=="busted"&&bjTotal(g.players[i])<=21)return i}return -1}
function bjAlive(){return bjGame.players.filter(p=>p.status!=="busted"&&bjTotal(p)<=21)}
function bjPlay(action){const g=bjGame;if(!g||g.phase!=="playing")return;const i=g.currentIndex,p=g.players[i];if(!p||p.human===false&&bjCpuTimer)return;if(!p.human)return;g.notice="";let didHit=action==="hit";if(didHit){const card=bjDraw(g);if(card)p.hand.push(card);else{didHit=false;g.notice="bjNoticeDeck"}}if(didHit){const total=bjTotal(p);if(total>21)p.status="busted";else p.status="active";if(total===21&&p.status!=="busted"){bjSettleRound(g,"bjReason21");render();return}const alive=bjAlive();if(!alive.length){bjSettleRound(g,"bjReasonLast");render();return}if(alive.length===1){bjSettleRound(g,"bjReasonLast");render();return}g.silentLaps=0;g.lapVisited=[]}else{p.status="stood";if(!g.lapVisited.includes(i))g.lapVisited.push(i)}const aliveIds=g.players.map((x,id)=>x.status!=="busted"&&bjTotal(x)<=21?id:-1).filter(id=>id>=0);if(aliveIds.length<=1){bjSettleRound(g,"bjReasonLast");render();return}if(aliveIds.every(id=>g.lapVisited.includes(id))){if(!didHit)g.silentLaps++;g.lapVisited=[];if(g.silentLaps>=2){bjSettleRound(g,"bjReasonStand");render();return}}const next=bjNextAlive(i);if(next<0){bjSettleRound(g,"bjReasonLast")}else g.currentIndex=next;render()}
function bjCpuWantsHit(g,id){const p=g.players[id],total=bjTotal(p),opponents=bjAlive().filter(other=>other!==p),higher=opponents.some(other=>bjTotal(other)>total);if(g.difficulty==="weak"){const probability=total<14?.78:total<17?.48:total<20?.22:.08;return Math.random()<probability}if(g.difficulty==="normal")return total<17&&higher;if(total>=20||!opponents.length)return false;const leader=Math.max(...opponents.map(bjTotal)),counts=new Map();const available=g.deck.length?g.deck:g.discard;available.forEach(card=>counts.set(card.rank,(counts.get(card.rank)||0)+1));const count=available.length;if(!count)return false;const probabilities=Array.from({length:13},(_,i)=>(counts.get(i+1)||0)/count);const bustProbability=probabilities.reduce((sum,prob,i)=>sum+(total+i+1>21?prob:0),0);const memo=new Map();const chance=score=>{if(score>21)return 0;if(score>leader)return 1;if(score===leader)return .5;if(score>=20)return 0;if(memo.has(score))return memo.get(score);let value=0;for(let v=1;v<=13;v++)if(probabilities[v-1])value+=probabilities[v-1]*chance(score+v);memo.set(score,value);return value};const standing=total>leader?1:total===leader?.5:0;let hitChance=0;for(let v=1;v<=13;v++)if(probabilities[v-1])hitChance+=probabilities[v-1]*chance(total+v);return bustProbability<.36&&hitChance>standing+1e-9}
function bjMaybeScheduleCpu(){if(!bjIsRoute()||!bjGame||bjGame.phase!=="playing"){if(bjCpuTimer){clearTimeout(bjCpuTimer);bjCpuTimer=null}return}const p=bjGame.players[bjGame.currentIndex];if(!p||p.human||bjCpuTimer)return;const game=bjGame,index=bjGame.currentIndex;bjCpuTimer=setTimeout(()=>{bjCpuTimer=null;if(bjGame!==game||!bjIsRoute()||game.phase!=="playing"||game.currentIndex!==index)return;const action=bjCpuWantsHit(game,index)?"hit":"stand";bjPlayCpu(action)},700)}
function bjPlayCpu(action){const g=bjGame;if(!g||g.phase!=="playing")return;const i=g.currentIndex,p=g.players[i];if(!p||p.human)return;g.notice="";let didHit=action==="hit";if(didHit){const card=bjDraw(g);if(card)p.hand.push(card);else{didHit=false;g.notice="bjNoticeDeck"}}if(didHit){const total=bjTotal(p);if(total>21)p.status="busted";else p.status="active";if(total===21&&p.status!=="busted"){bjSettleRound(g,"bjReason21");render();return}const alive=bjAlive();if(!alive.length||alive.length===1){bjSettleRound(g,"bjReasonLast");render();return}g.silentLaps=0;g.lapVisited=[]}else{p.status="stood";if(!g.lapVisited.includes(i))g.lapVisited.push(i)}const aliveIds=g.players.map((x,id)=>x.status!=="busted"&&bjTotal(x)<=21?id:-1).filter(id=>id>=0);if(aliveIds.length<=1){bjSettleRound(g,"bjReasonLast");render();return}if(aliveIds.every(id=>g.lapVisited.includes(id))){if(!didHit)g.silentLaps++;g.lapVisited=[];if(g.silentLaps>=2){bjSettleRound(g,"bjReasonStand");render();return}}const next=bjNextAlive(i);if(next<0)bjSettleRound(g,"bjReasonLast");else g.currentIndex=next;render()}
function bjDeal(){const g=bjGame;if(!g||g.phase!=="betting")return;const bets=g.players.map((p,i)=>Number(g.betDraft[i]));if(bets.some((bet,i)=>!Number.isInteger(bet)||bet<1||bet>g.players[i].chips)){g.notice="bjBadBet";render();return}g.players.forEach((p,i)=>{p.bet=bets[i];p.chips-=bets[i]});g.phase="playing";g.players.forEach(p=>{p.hand=[];p.status="active"});for(let n=0;n<2;n++)for(const p of g.players){const card=bjDraw(g);if(card)p.hand.push(card)}g.players.forEach(p=>{if(bjTotal(p)>21)p.status="busted"});const alive=bjAlive();if(!alive.length){bjSettleRound(g,"bjReasonLast");render();return}if(alive.some(p=>bjTotal(p)===21)){bjSettleRound(g,"bjReason21");render();return}if(alive.length===1){bjSettleRound(g,"bjReasonLast");render();return}g.currentIndex=g.players.findIndex(p=>p.status!=="busted");g.silentLaps=0;g.lapVisited=[];render()}
function bjChooseHand(id,hand){const g=bjGame;if(!g||g.phase!=="janken"||!bjHands.includes(hand)||!g.jankenEligible.includes(id)||!g.players[id].human||g.jankenChoices[id])return;g.jankenChoices[id]=hand;if(g.jankenEligible.filter(i=>g.players[i].human).every(i=>g.jankenChoices[i]))bjResolveJanken(g);render()}
function bjQuit(){if(bjCpuTimer){clearTimeout(bjCpuTimer);bjCpuTimer=null}bjGame=null;bjSetup=bjNewSetup();bjSetup.rules=false;location.hash="#/app/games"}
app.addEventListener("input",event=>{const name=event.target.closest("[data-bj-name]");if(name&&bjSetup){bjSetup.seats[Number(name.dataset.bjName)].name=name.value.slice(0,20);return}const bet=event.target.closest("[data-bj-bet]");if(bet&&bjGame&&bjGame.phase==="betting")bjGame.betDraft[Number(bet.dataset.bjBet)]=bet.value});

function renderExternalGame(game){const state=externalGameState?.id===game.id?externalGameState:null,mode=state?.mode||"intro",open=`<a class="primary-link external-game-open" href="${esc(game.url)}" target="_blank" rel="noopener noreferrer">${esc(t("externalGameOpenTab"))} ↗</a>`;let content;if(mode==="intro")content=`<p class="page-subtitle external-game-intro">${esc(t("externalGameIntro"))}</p><button type="button" class="primary-link external-game-play" data-external-game-play="${esc(game.id)}">${esc(t("externalGamePlay"))}</button>`;else if(mode==="fallback")content=`<p class="external-game-note" role="status">${esc(t("externalGameBlockedNote"))}</p>${open}`;else content=`<div class="external-game-frame-wrap"><iframe title="${esc(t(game.nameKey))}" src="${esc(game.url)}" sandbox="allow-scripts allow-same-origin allow-popups" loading="lazy" data-external-game-frame="${esc(game.id)}" data-external-game-token="${state?.token||0}"></iframe></div>${open}<p class="external-game-hint">${esc(t("externalGameFallbackHint"))}</p><p class="external-game-status" role="status" data-external-game-status>${esc(t(mode==="loading"?"externalGameLoading":"externalGameReady"))}</p>`;return `<div class="external-game-screen"><a class="backlink" href="#/app/games">‹ ${esc(t("back"))}</a><p class="eyebrow">${esc(t("games"))}</p><h1 class="page-title">${esc(t(game.nameKey))}</h1>${content}</div>`}
function startExternalGame(id){const game=EXTERNAL_GAMES.find(item=>item.id===id);if(!game)return;if(externalGameTimer){clearTimeout(externalGameTimer);externalGameTimer=null}const token=++externalGameRunId;externalGameState={id,token,mode:game.embeddable?"loading":"fallback"};render();if(game.embeddable)externalGameTimer=setTimeout(()=>externalGameLoadTimeout(id,token),5000)}
function externalGameLoadTimeout(id,token){if(!externalGameState||externalGameState.id!==id||externalGameState.token!==token||externalGameState.mode!=="loading")return;externalGameTimer=null;externalGameState.mode="fallback";render()}
function externalGameFrameLoaded(frame){if(!frame||!externalGameState||externalGameState.mode!=="loading"||frame.dataset.externalGameFrame!==externalGameState.id||Number(frame.dataset.externalGameToken)!==externalGameState.token)return;if(externalGameTimer){clearTimeout(externalGameTimer);externalGameTimer=null}externalGameState.mode="embedded";const status=app.querySelector("[data-external-game-status]");if(status)status.textContent=t("externalGameReady")}
function externalGameFrameFailed(frame){if(!frame||!externalGameState||frame.dataset.externalGameFrame!==externalGameState.id||Number(frame.dataset.externalGameToken)!==externalGameState.token)return;externalGameLoadTimeout(externalGameState.id,externalGameState.token)}
function renderGameStub(id){const item=GAME_ITEMS.find(x=>x.id===id);if(!item)return renderNotFound();return `<a class="backlink" href="#/app/games">‹ ${esc(t("back"))}</a><p class="eyebrow">${esc(t("games"))}</p><h1 class="page-title">${esc(t(item.nameKey))}</h1><section class="empty-state"><div class="empty-icon" aria-hidden="true">${item.icon}</div><h2>${esc(t("comingSoon"))}</h2><p>${esc(t("gameStub"))}</p></section>`}
function renderNotFound(){return `<a class="backlink" href="#/home">‹ ${esc(t("home"))}</a><section class="empty-state"><h2>${esc(t("stubTitle"))}</h2><p>${esc(t("stubText"))}</p></section>`}
function route(){const raw=location.hash.replace(/^#\/?/,"");const parts=raw.split("/").filter(Boolean);if(!parts.length||parts[0]==="home")return {kind:"screen",render:renderHome,nav:"home"};if(parts[0]==="apps")return {kind:"screen",render:renderApps,nav:"apps"};if(parts[0]==="settings")return {kind:"screen",render:renderSettings,nav:"settings"};if(parts[0]==="game"){if(parts[1]==="blackjack")return {kind:"screen",render:renderBlackjack,nav:"apps"};const externalGame=EXTERNAL_GAMES.find(item=>item.id===parts[1]);if(externalGame)return {kind:"screen",render:()=>renderExternalGame(externalGame),nav:"apps",externalGame};return {kind:"screen",render:()=>renderGameStub(parts[1]),nav:"apps"}}if(parts[0]==="app"){const item=APPS.find(x=>x.id===parts[1]);return item?{kind:"app",item,nav:"apps"}:{kind:"screen",render:renderNotFound,nav:"apps"}}return {kind:"screen",render:renderNotFound,nav:"home"}}
function updateClock(){const now=new Date();document.querySelectorAll("[data-clock]").forEach(el=>el.textContent=now.toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}));document.querySelectorAll("[data-date]").forEach(el=>el.textContent=now.toLocaleDateString(locale(),{weekday:"long",year:"numeric",month:"long",day:"numeric"}))}
function drawNav(active){nav.setAttribute("aria-label",t("mainNavigation"));const entries=[["home","home","⌂"],["apps","apps","▦"],["settings","settings","⚙"]];nav.innerHTML=entries.map(([id,key,icon])=>`<a class="navlink" href="#/${id}" ${active===id?'aria-current="page"':""}><span class="navicon" aria-hidden="true">${icon}</span><span>${esc(t(key))}</span></a>`).join("")}
function applyLanguage(){document.documentElement.lang=lang;document.title=t("appTitle");document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute("content",t("appTitle"));document.querySelector(".phone").setAttribute("aria-label",t("appTitle"));document.querySelector(".brand").setAttribute("aria-label",t("appTitle"));document.getElementById("brandName").textContent=t("appTitle");document.querySelectorAll(".lang").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));document.querySelector(".languages").setAttribute("aria-label",t("languageNav"))}
function render(){document.body.classList.toggle("bj-mode",bjIsRoute());document.querySelector(".phone").classList.toggle("bj-mode",bjIsRoute());applyLanguage();const r=route();if(!r.externalGame||(externalGameState&&externalGameState.id!==r.externalGame.id)){if(externalGameTimer){clearTimeout(externalGameTimer);externalGameTimer=null}externalGameState=null}app.innerHTML=r.kind==="app"?r.item.render():r.render();applyBrandIcons();drawNav(r.nav);updateClock();bjMaybeScheduleCpu();const reset=document.getElementById("resetButton");if(reset)reset.addEventListener("click",()=>{if(window.confirm(t("resetConfirm"))){lang="ja";theme="dark";try{localStorage.removeItem(LANG_KEY);localStorage.removeItem(THEME_KEY)}catch(_){ }document.documentElement.dataset.theme=theme;render();window.alert(t("resetDone"))}})}
function setLanguage(next){if(!["ja","en","nu"].includes(next))return;lang=next;try{localStorage.setItem(LANG_KEY,lang)}catch(_){ }render()}
function setTheme(next){if(!["dark","light"].includes(next))return;theme=next;document.documentElement.dataset.theme=theme;try{localStorage.setItem(THEME_KEY,theme)}catch(_){ }render()}
document.documentElement.dataset.theme=theme;
document.addEventListener("click",event=>{const l=event.target.closest("[data-lang]");if(l){setLanguage(l.dataset.lang);return}const th=event.target.closest("[data-theme-choice]");if(th)setTheme(th.dataset.themeChoice)});
window.addEventListener("hashchange",render);
if(!location.hash)location.hash="#/home";else render();
setInterval(updateClock,1000);
</script>
</body>
</html>
