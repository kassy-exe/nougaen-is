  <style>

    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;background:radial-gradient(ellipse at 50% 4%,#34395888 0,transparent 44%),var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px 12px}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}

    #app{flex:1;overflow:auto;overscroll-behavior:contain;padding:22px 20px 24px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;animation:appear .2s ease-out}.bottomnav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid color-mix(in srgb,var(--line),transparent 35%);background:color-mix(in srgb,var(--bg),transparent 5%)}.navlink{min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:16px;color:var(--muted);font-size:13px;transition:background .18s,color .18s}.navlink .navicon{font-size:16px}.navlink[aria-current="page"]{background:var(--panel-2);color:var(--gold);font-weight:700}
    @keyframes appear{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .eyebrow{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 8px}.page-title{font-size:27px;line-height:1.15;letter-spacing:-.035em;margin:0 0 8px}.page-subtitle{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:24px 0 12px}.section-head h2{font-size:15px;letter-spacing:.03em;margin:0}.small-link{color:var(--gold);font-size:12px;text-decoration:none;white-space:nowrap}.hero{margin-top:12px;padding:24px 20px 20px;border:1px solid #8d835355;border-radius:var(--radius);background:linear-gradient(135deg,#222942,var(--panel) 60%,#171d2c);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-32px;top:-56px;width:150px;height:210px;border:1px solid #e2d5a126;transform:rotate(28deg);clip-path:polygon(50% 0,100% 100%,50% 79%,0 100%);background:linear-gradient(160deg,#d8c48a12,transparent)}:root[data-theme="light"] .hero{background:linear-gradient(135deg,#dfe3f1,var(--panel) 65%,#f5f1e5)}
    .clock-time{font-variant-numeric:tabular-nums;letter-spacing:-.065em;font-size:clamp(52px,16vw,76px);font-weight:300;line-height:1.05;margin:7px 0 9px;position:relative;z-index:1}.clock-date{font-size:13px;color:var(--muted);position:relative;z-index:1}.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:14px;border-top:1px solid #ffffff16;position:relative;z-index:1;color:var(--muted);font-size:11px;letter-spacing:.09em}.hero-foot strong{color:var(--gold);font-size:10px;letter-spacing:.14em;font-weight:650}

    .panel{padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--panel);margin-top:18px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0;padding-bottom:0}.setting-row:first-child{padding-top:0}.setting-label{font-size:14px;font-weight:600}.setting-hint{color:var(--muted);font-size:11px;line-height:1.5;margin-top:4px}.segmented{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:13px;background:var(--bg)}.segmented button{border:0;border-radius:10px;background:transparent;color:var(--muted);padding:8px 11px;font-size:11px}.segmented button[aria-pressed="true"]{background:var(--indigo);color:var(--gold);font-weight:700}.danger{min-height:46px;padding:0 15px;border:1px solid #aa6c6c77;border-radius:14px;background:#9d49491a;color:#e7aaaa;font-size:13px;font-weight:650}.empty-state{margin-top:26px;padding:28px 20px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(135deg,var(--panel-2),var(--panel));text-align:center}.empty-icon{font-size:34px;color:var(--gold);margin-bottom:14px}.empty-state h2{font-size:18px;margin:0 0 8px}.empty-state p{font-size:13px;line-height:1.7;color:var(--muted);margin:0}.primary-link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;margin-top:18px;border:1px solid var(--gold-dim);border-radius:15px;background:linear-gradient(135deg,#dac788,#b6a369);color:#211f18;font-weight:750;font-size:13px;text-decoration:none}.clock-panel{margin-top:24px;padding:26px 18px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(155deg,var(--panel-2),var(--panel));text-align:center}.clock-panel .clock-time{font-size:clamp(58px,18vw,82px)}.backlink{display:inline-flex;align-items:center;gap:7px;margin:0 0 18px;color:var(--muted);font-size:12px;text-decoration:none}.backlink:hover{color:var(--gold)}.fo     @media(max-width:480px){body{padding:0;background:var(--bg)}.phone{position:fixed;inset:0;width:100%;height:auto;min-height:0;border:0;border-radius:0;box-shadow:none}.topbar{padding-top:calc(13px + env(safe-area-inset-top))}#app{padding-inline:18px}.bottomnav{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}
    @media(max-height:710px) and (min-width:481px){.phone{min-height:0;height:calc(100dvh - 24px)}body{padding:12px}.hero{padding-top:16px;padding-bottom:14px}.app-card{min-height:96px}}

    .bj-stack{display:grid;gap:14px;margin-top:18px}.bj-panel{padding:16px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--panel-2),var(--panel) 72%)}.bj-panel h2{font-size:15px;margin:0 0 12px}.bj-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.bj-field{display:grid;gap:6px;color:var(--muted);font-size:11px}.bj-field input,.bj-field select,.bj-bet-input{width:100%;min-height:44px;padding:0 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}.bj-field input:focus,.bj-field select:focus,.bj-bet-input:focus{outline:2px solid var(--gold-dim);outline-offset:1px}.bj-seats{display:grid;gap:10px}.bj-seat{padding:13px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--panel),transparent 8%)}.bj-seat-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.bj-seat-title{font-size:12px;color:var(--gold);letter-spacing:.08em}.bj-chipline{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:9px;color:var(--muted);font-size:11px}.bj-chipline strong{color:var(--ink);font-variant-numeric:tabular-nums}.bj-btn{min-height:48px;padding:0 15px;border:1px solid var(--line);border-radius:14px;background:var(--panel-2);font-size:13px;font-weight:700}.bj-btn:hover:not(:disabled){border-color:var(--gold-dim)}.bj-btn:disabled{opacity:.48;cursor:not-allowed}.bj-btn-primary{border-color:var(--gold-dim);background:linear-gradient(135deg,#dac788,#b6a369);color:#211f18}.bj-btn-subtle{color:var(--gold)}.bj-btn-danger{color:#e7aaaa;border-color:#aa6c6c77;background:#9d49491a}.bj-btn-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.bj-note{font-size:11px;line-height:1.6;color:var(--muted);margin:8px 0 0}.bj-rule-copy{white-space:pre-line;color:var(--muted);font-size:12px;line-height:1.75}.bj-modal{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;background:#0     /* Blackjack: use the whole viewport as a compact, readable game table. */
    body.bj-mode{padding:0;place-items:stretch}
    body.bj-mode .phone{width:100%;max-width:none;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}
    .phone.bj-mode .topbar{min-height:54px;padding:8px 16px}
    .phone.bj-mode #app{overflow:hidden;padding:9px 12px 12px;display:flex;flex-direction:column;animation:none}
    .phone.bj-mode .bottomnav{display:none}
    .bj-screen{height:100%;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
    .bj-screen-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none;min-height:38px}
    .bj-screen-heading{min-width:0}.bj-screen-heading .eyebrow{font-size:9px;margin:0 0 2px;letter-spacing:.14em}
    .bj-screen-heading h1{font-size:clamp(17px,4.5vw,22px);line-height:1.1;letter-spacing:-.025em;margin:0}
    .bj-back{font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
    .bj-head-button{min-height:42px;padding:0 11px;font-size:11px;white-space:nowrap}
    .bj-screen-hint{flex:none;margin:0;color:var(--muted);font-size:11px;line-height:1.35}
    .bj-setup-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
    .bj-setup-controls .bj-field{gap:4px;font-size:10px}.bj-setup-controls select{min-height:40px}
    .bj-setup-label{font-size:11px;color:var(--gold);letter-spacing:.08em;flex:none;margin-top:1px}
    .bj-setup-seats,.bj-bet-grid,.bj-janken-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;min-height:0;align-content:stretch}
    .bj-setup-seats{flex:1;grid-auto-rows:minmax(0,1fr)}
    .bj-setup-seat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-content:center;gap:5px;padding:7px 8px;min-height:0;overflow:hidden}
    .bj-setup-seat .bj-seat-head{grid-column:1/-1;margin:0;min-height:18px}.bj-setup-seat .bj-field{gap:3px;font-size:9px}
    .bj-setup-seat .bj-field input,.bj-setup-seat .bj-field select{min-height:34px;padding:0 8px;font-size:12px;border-radius:9px}
    .bj-start{flex:none;min-height:48px}
    .bj-bet-screen .bj-screen-hint{margin-top:-2px}
    .bj-bet-grid{flex:1;grid-auto-rows:minmax(0,1fr)}
    .bj-bet-card{min-height:0;padding:8px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,var(--panel-2),var(--panel) 75%);display:flex;flex-direction:column;justify-content:space-between;gap:4px;overflow:hidden}
    .bj-bet-name{font-size:11px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bj-bet-balance{display:flex;gap:9px;color:var(--muted);font-size:9px;white-space:nowrap}.bj-bet-balance strong{color:var(--ink);font-variant-numeric:tabular-nums}
    .bj-wager{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:7px;color:var(--muted);font-size:10px;min-width:0}
    .bj-wager .bj-bet-input{width:84px;min-height:42px;padding:0 9px;font-size:16px;font-weight:750;text-align:center;border-color:var(--gold-dim)}
    .bj-auto-wager{display:grid;place-items:center;min-width:54px;min-height:38px;padding:0 10px;border-radius:10px;background:var(--indigo);color:var(--gold);font-size:17px;font-variant-numeric:tabular-nums}
    .bj-deal{flex:none;min-height:52px;font-size:14px}
    .bj-error{color:#e99c9c;margin:0}
    .bj-player-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:7px;flex:1;min-height:0;align-content:stretch}
    .bj-player{min-width:0;min-height:0;padding:7px 8px;border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;gap:3px;overflow:hidden}
    .bj-player-top{align-items:center;min-height:17px;gap:5px}.bj-player-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;line-height:1.2}
    .bj-player-name .bj-role-tag{padding:2px 5px;font-size:8px;margin-left:3px;vertical-align:1px}
    .bj-state{font-size:9px;letter-spacing:-.02em}
    .bj-score-row{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:32px;flex:1;min-width:0}
    .bj-cards{display:flex;flex-wrap:wrap;align-content:center;align-items:center;gap:2px;min-width:0;min-height:30px;max-height:64px;overflow:hidden;margin:0;flex:1}
    .bj-card{width:22px;height:29px;flex:none;border-radius:5px;box-shadow:0 1px 3px #0004}.bj-card-rank{font-size:11px}.bj-card-suit{font-size:10px;margin-top:1px}
    .bj-total{margin:0;flex:none;display:grid;place-items:center;min-width:32px;height:30px;padding:0 5px;border-radius:9px;background:color-mix(in srgb,var(--gold),transparent 87%);color:var(--gold);font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
    .bj-chipline{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:0;color:var(--muted);font-size:8px;line-height:1.15;white-space:nowrap}
    .bj-chipline span{overflow:hidden;text-overflow:ellipsis}.bj-chipline b{color:var(--ink);font-size:10px;font-variant-numeric:tabular-nums}
    .bj-action-area{flex:none;margin:0;padding:8px 9px;border-radius:14px}.bj-turn-line{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 6px;font-size:11px;color:var(--muted)}.bj-turn-line strong{color:var(--gold);font-size:13px}
    .bj-actions{gap:8px}.bj-actions .bj-btn{min-height:52px;font-size:15px;border-radius:13px}
    .bj-janken-grid{flex:1;grid-auto-rows:minmax(80px,1fr)}.bj-janken-player{min-height:0;padding:8px;margin:0;border-radius:13px;display:flex;flex-direction:column;justify-content:center;gap:6px;overflow:hidden}
    .bj-janken-title{font-size:10px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bj-janken-choices{gap:4px}.bj-janken-choices .bj-btn{min-height:42px;padding:3px;font-size:10px}
    .bj-result-summary{flex:none;padding:9px 11px;border:1px solid var(--line);border-radius:13px;background:var(--panel)}
    .bj-result-title{font-size:13px;margin:0}.bj-result-summary .bj-note{font-size:10px;margin:3px 0 0;line-height:1.3}
    .bj-pot-line{display:flex;justify-content:space-between;align-items:center;margin-top:5px;padding-top:5px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.bj-pot-line strong{color:var(--gold);font-size:14px}
    .bj-result-list{display:grid;grid-template-columns:1fr;grid-auto-rows:minmax(0,1fr);min-height:0;flex:1;overflow:hidden}
    .bj-result-list .bj-payout-row{min-height:0;padding:5px 2px;align-items:center;font-size:9px;gap:5px;overflow:hidden}.bj-result-list .bj-payout-label{min-width:0;overflow:hidden;text-overflow:ellipsis}.bj-result-list .bj-payout-label strong{color:var(--ink)}.bj-result-list .bj-payout-label small{display:block;font-size:8px;line-height:1.2;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bj-result-list .bj-payout-value{font-size:9px;white-space:nowrap}
    .bj-result-actions{flex:none}.bj-result-actions .bj-btn{width:100%;min-height:49px}

    .ai-mode-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:4px 0 2px}
    .ai-mode-range{width:100%;accent-color:var(--gold)}
    .ai-mode-name{text-align:center;font-size:13px;margin:2px 0 10px}
    .ai-log{display:grid;gap:8px;margin:10px 0;max-height:46dvh;overflow:auto;padding-right:2px}
    .ai-msg{padding:10px 12px;border-radius:14px;font-size:14px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere;border:1px solid var(--line);background:var(--panel)}
    .ai-msg.me{background:var(--indigo);color:var(--gold);margin-left:36px}
    .ai-msg.ai{background:linear-gradient(145deg,var(--panel-2),var(--panel));margin-right:36px}
    .ai-msg.err{border-color:#aa6c6c77;color:#e7aaaa;margin-right:36px}
    .ai-empty{color:var(--muted);font-size:13px;text-align:center;padding:14px 0}
    .ai-input{width:100%;box-sizing:border-box;min-height:52px;padding:11px;border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;resize:vertical}
    .ai-input:focus{outline:2px solid var(--gold-dim);outline-offset:1px}
    .ai-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
    .ai-check{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
    .ai-notice{padding:10px 12px;border:1px solid var(--gold-dim);border-radius:14px;font-size:12px;line-height:1.6;margin:10px 0;background:color-mix(in srgb,var(--panel-2),transparent 10%)}
    .ai-setup{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}
    .ai-setup summary{font-size:14px;font-weight:700;cursor:pointer}
    .ai-field{display:grid;gap:6px;color:var(--muted);font-size:11px;margin-top:13px}
    .ai-field input[type="password"],.ai-field input[type="url"]{width:100%;min-height:44px;padding:0 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px}
    .ai-status{font-size:11px;color:var(--muted);margin-top:6px}
    .ai-status strong{color:var(--gold)}
    .external-game-screen{display:flex;flex-direction:column;gap:9px;min-height:100%;padding-bottom:10px}
    .external-game-screen .backlink{margin-bottom:3px}.external-game-screen .page-title{margin:0;font-size:clamp(24px,7vw,32px)}
    .external-game-intro{margin-top:5px}
    .external-game-play{width:100%;min-height:66px;margin-top:20px;font-size:18px;font-weight:750}
    .external-game-frame-wrap{width:100%;aspect-ratio:16/9;min-height:220px;max-height:60dvh;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--panel);box-shadow:var(--shadow)}
    .external-game-frame-wrap iframe{display:block;width:100%;height:100%;border:0;background:var(--panel)}
    .external-game-open{width:100%;min-height:50px;margin-top:0;font-size:14px}
    .external-game-note,.external-game-hint,.external-game-status{margin:0;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--muted);font-size:12px;line-height:1.5}
    .external-game-note{border-color:var(--gold-dim);color:var(--ink)}.external-game-status{padding:7px 10px;font-size:10px}
    @media(min-width:481px){.external-game-screen{max-width:880px;margin:0 auto;width:100%}.external-game-frame-wrap{min-height:300px}}

function trBreakdown(script){
  const idx=trDictIndex();const keys=[...idx.keys()].sort((a,b)=>b.length-a.length);
  const out=[];
  for(const w of String(script).split(/\s+/).filter(Boolean)){
    if(idx.has(w)){out.push([w,idx.get(w)[2]]);continue}
    let rest=w;const segs=[];
    while(rest){const hit=keys.find(k=>rest.startsWith(k));if(!hit)break;segs.push([hit,idx.get(hit)[2]]);rest=rest.slice(hit.length)}
    if(!rest&&segs.length>1)out.push(...segs);
  }
  return out;
}

const NU_PACK="【NougÆn語と砮文字（かっしー作の人工言語と、その独自文字）】\nあなたは下の文法・例文・辞書を使って、砮文字で書かれた文を読み取り、砮文字で文を作ることもできる。\n【会話の原則】これが最優先。\n- あなたは普通の会話相手。ユーザーが日本語で話しかけたら、日本語で普通に会話すること。何でもNougÆn語に訳そうとしない\n- 砮文字を読む・書くのは、ユーザーが砮文字で書いてきた時と、NougÆn語で書くよう頼まれた時だけ\n- ユーザーが砮文字で書いてきたら、文法と辞書で意味を取って、その内容に返事をすること\n- ユーザーの文をそのまま繰り返したり、訳だけを返したりしない（オウム返し禁止）。必ず内容への返事を書くこと\n- 砮文字で話しかけられたら、返事も砮文字で書くこと（日本語訳を（ ）で添える）。日本語だけで返さない\n- 砮文の中に日本語を混ぜない。日本語は（ ）の訳の中だけ。辞書にない語や名前は、日本語や造語で補わず、必ず ¿英語¿ の形（両側を ¿ で囲む。? で閉じない）で補うこと。場所や物の名前も ¿英語¿ で書く。辞書の語を勝手に合成して新しい単語を作らない\n【会話の例】ユーザーの文を繰り返さず、内容に砮文字で返す。\nユーザー: tɛi jæsɑ mɛi\nAI: mɛi ⟨no⟩ jæsɑ tɛi（あなたは私を哀しく思わなくていい）\nユーザー: mɛi dʒihmi tɛi?\nAI: tɛi dʒihmi mɛi（私があなたを見る）\nユーザー: tɛi ðʒɑuɹtʃ ¿pizza¿\nAI: tɛi jæfuf ¿pizza¿（私はピザが好きだ）\nユーザー: mɛi ⟨stæsth⟩ ¿school¿?\nAI: ⟨fi⟩ tɛi ⟨stæsth⟩ ¿school¿（私は学校へ行くだろう）\n- 辞書にない語が必要な時は、諦めて「言えない」と答えず、¿英語¿ で補って文を完成させること（それがこの言語の正式なルール）。「今の辞書では言えない」のような返事はしない\n■ 音字（発音をそのまま表す文字）: p b t d k g f v θ ð s z ʃ ʒ h m n ŋ l ɹ j w / i ɛ æ ɑ ɔ ʌ ə ʊ u。破擦音と二重母音は続けて書く（ts dʒ tʃ ɑu eɪ ɑɪ ɔj ɔʊ）。ɝとɚは əɹ と書く。\n■ 語幹字（頻出の語素を1字に縮めた文字）: この画面では ⟨名前⟩ の形で表す。あなたが砮文字を書く時は、語幹字を必ず ⟨名前⟩ の形で書き、音字の部分はIPAの文字で書くこと。一覧: ⟨kerka⟩=/kɝkə/ ⟨auv⟩=/ɑuv/ ⟨hai⟩=/hɑɪ/ ⟨læ⟩=/læ/ ⟨stæsth⟩=/stæθ/ ⟨nop⟩=/nɔp/ ⟨fi⟩=/fi/ ⟨tekæ⟩=/tɛkæ/ ⟨no⟩=/nɔ/ ⟨na⟩=/nɑ/ ⟨they⟩=/θeɪ/\n■ 数字は12進数。0から9の次は Ƨ（10）、Ɛ（11）。\n【文法】文はこの規則でのみ組み立てる。\n- 単語は活用も変形もしない。助詞も接続語もない。「誰が」「何を」は語順だけで決まる\n- 基本語順は 主語＋動詞＋目的語。動詞と形容詞は必ず2番目に置く（V2）\n- 時制は ⟨na⟩=過去、⟨læ⟩=現在、⟨fi⟩=未来 を文頭に置いて表す\n- 否定は ⟨no⟩ を動詞の直前に置く（⟨no⟩は動詞として数えない）\n- 疑問文は文末に ? を付けるだけ\n- 感情語（辞書の「感情」カテゴリの語）は必ず文末に置く。感情語を2番目に置くと「〜な気持ちだ」という状態の動詞になる\n- 複数の語句を並べる時は Ω でつなぐ。装飾同士は Θ でつなぐ\n- 使役（〜させる）は動詞の末尾に ɲ を付ける\n- 日付・時間は [数字] [時制] ⟨læ⟩ɑuɹn [zuɹnɛn=日 / lunæn=月 / wɑuɹŋ=年] の形。数字が1の時は数字を省略する\n- 辞書にない語は ¿英語¿ の形で書く。似た意味の既存の単語で無理に代用しない\n【文の作り方】\n1. 言いたい内容を「主語・動詞・目的語・時制・否定・感情」に分解する\n2. 辞書にある単語だけを、文法の語順に当てはめる\n3. 役割の決まらない単語は置かない。単語を意味なく並べることは禁止\n4. 出力する前に、作った文を自分で日本語に訳し戻して、元の意味と一致するか必ず確認する。一致しなければ直す\n5. 辞書にない語が要る時は ¿英語¿ で補い、必ず文を完成させる。途中で諦めない\n【例文】\ntɛi dʒihmi mɛi（私があなたを見る）\nmɛi dʒihmi tɛi（あなたが私を見る）\n⟨na⟩ tɛi function bjCpuWantsHit(g,id){const p=g.players[id],total=bjTotal(p),opponents=bjAlive().filter(other=>other!==p),higher=opponents.some(other=>bjTotal(other)>total);if(g.difficulty==="weak"){const probability=total<14?.78:total<17?.48:total<20?.22:.08;return Math.random()<probability}if(g.difficulty==="normal")return total<17&&higher;if(total>=20||!opponents.length)return false;const leader=Math.max(...opponents.map(bjTotal)),counts=new Map();const available=g.deck.length?g.deck:g.discard;available.forEach(card=>counts.set(card.rank,(counts.get(card.rank)||0)+1));const count=available.length;if(!count)return false;const probabilities=Array.from({length:13},(_,i)=>(counts.get(i+1)||0)/count);const bustProbability=probabilities.reduce((sum,prob,i)=>sum+(total+i+1>21?prob:0),0);const memo=new Map();const chance=score=>{if(score>21)return 0;if(score>leader)return 1;if(score===leader)return .5;if(score>=20)return 0;if(memo.has(score))return memo.get(score);let value=0;for(let v=1;v<=13;v++)if(probabilities[v-1])value+=probabilities[v-1]*chance(score+v);memo.set(score,value);return value};const standing=total>leader?1:total===leader?.5:0;let hitChance=0;for(let v=1;v<=13;v++)if(probabilities[v-1])hitChance+=probabilities[v-1]*chance(total+v);return bustProbability<.36&&hitChance>standing+1e-9}

function bjPlayCpu(action){const g=bjGame;if(!g||g.phase!=="playing")return;const i=g.currentIndex,p=g.players[i];if(!p||p.human)return;g.notice="";let didHit=action==="hit";if(didHit){const card=bjDraw(g);if(card)p.hand.push(card);else{didHit=false;g.notice="bjNoticeDeck"}}if(didHit){const total=bjTotal(p);if(total>21)p.status="busted";else p.status="active";if(total===21&&p.status!=="busted"){bjSettleRound(g,"bjReason21");render();return}const alive=bjAlive();if(!alive.length||alive.length===1){bjSettleRound(g,"bjReasonLast");render();return}g.silentLaps=0;g.lapVisited=[]}else{p.status="stood";if(!g.lapVisited.includes(i))g.lapVisited.push(i)}const aliveIds=g.players.map((x,id)=>x.status!=="busted"&&bjTotal(x)<=21?id:-1).filter(id=>id>=0);if(aliveIds.length<=1){bjSettleRound(g,"bjReasonLast");render();return}if(aliveIds.every(id=>g.lapVisited.includes(id))){if(!didHit)g.silentLaps++;g.lapVisited=[];if(g.silentLaps>=2){bjSettleRound(g,"bjReasonStand");render();return}}const next=bjNextAlive(i);if(next<0)bjSettleRound(g,"bjReasonLast");else g.currentIndex=next;render()}

let studyState=null;
const STUDY_BEST_KEY="nougaen-is-study-best";
function studyBest(){
  try{return JSON.parse(localStorage.getItem(STUDY_BEST_KEY)||"{}")}catch(_){return {}}
}
function studyPool(){
  if(!studyState||studyState.cat==="all")return DICT.map((e,i)=>i);
  return DICT.map((e,i)=>i).filter(i=>DICT[i][3]===studyState.cat);
}
function studyShuffleArr(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function studyAnswerField(e){return studyState.mode==="nu2ja"?e[2]:studyState.mode==="ja2nu"?e[4]:e[0]}
function studyMakeOptions(entryIdx){
  const s=studyState;
  const entry=DICT[entryIdx];
  const ans=studyAnswerField(entry);
  const seen=new Set([ans]);
  const opts=[entryIdx];
  const sameCat=studyShuffleArr(DICT.map((e,i)=>i).filter(i=>i!==entryIdx&&DICT[i][3]===entry[3]));
  const others=studyShuffleArr(DICT.map((e,i)=>i).filter(i=>i!==entryIdx&&DICT[i][3]!==entry[3]));
  for(const i of sameCat.concat(others)){
    if(opts.length>=4)break;
    const v=studyAnswerField(DICT[i]);
    if(seen.has(v))continue;
    seen.add(v);opts.push(i);
  }
  return studyShuffleArr(opts);
}
function studyStartQuiz(){
  const s=studyState;
  const pool=studyShuffleArr(studyPool().slice());
  s.deck=pool.slice(0,Math.min(10,pool.length));
  s.qi=0;s.score=0;s.streak=0;s.answered=null;
  s.options=studyMakeOptions(s.deck[0]);
  s.screen="quiz";
  render();
}
function studyAnswer(i){
  const s=studyState;
  if(!s||s.screen!=="quiz"||s.answered)return;
  const correctIdx=s.deck[s.qi];
  const ok=s.options[i]===correctIdx;
  s.answered={picked:i,ok};
  if(ok){s.score++;s.streak++}else s.streak=0;
  render();
}
function studyNext(){
  const s=studyState;
  if(s.qi+1>=s.deck.length){
    s.screen="result";
    const best=studyBest();
    const key=s.mode+"|"+s.cat;
    if(s.score>(best[key]||0)){best[key]=s.score;try{localStorage.setItem(STUDY_BEST_KEY,JSON.stringify(best))}catch(_){}}
    render();return;
  }
  s.qi++;s.answered=null;
  s.options=studyMakeOptions(s.deck[s.qi]);
  render();
}
function studyStartCards(){
  const s=studyState;
  s.deck=studyShuffleArr(studyPool().slice());
  s.cardIdx=0;s.flipped=false;
  s.screen="cards";
  render();
}
function renderStudy(){
  const head=`<p class="eyebrow">${esc(t("study"))}</p><h1 class="page-title">${esc(t("study"))}</h1>`;
  if(!studyState)studyState={screen:"home",mode:"nu2ja",cat:"all"};
  const s=studyState;
  if(s.screen==="quiz"){
    const entry=DICT[s.deck[s.qi]];
    const qHtml=s.mode==="ja2nu"
      ?`<div class="st-q-ja">${esc(entry[2])}</div>`
      :`<div class="st-q nu-font">${esc(entry[4])}</div>`;
    const opts=s.options.map((oi,i)=>{
      const e=DICT[oi];
      const label=s.mode==="nu2ja"?esc(e[2]):s.mode==="ja2nu"?`<span class="nu-font" style="font-size:20px">${esc(e[4])}</span>`:esc(e[0]);
      let cls="st-opt";
      if(s.answered){
        if(oi===s.deck[s.qi])cls+=" st-correct";
        else if(i===s.answered.picked)cls+=" st-wrong";
      }
      return `<button type="button" class="${cls}" data-study-opt="${i}" ${s.answered?"disabled":""}>${label}</button>`;
    }).join("");

      const e=entry;
      feedback=`<div class="st-feedback ${s.answered.ok?"st-ok":"st-ng"}">${s.answered.ok?esc(t("studyCorrect")):esc(t("studyWrong"))} — <span class="nu-font">${esc(e[4])}</span> ${esc(e[0])} /${esc(e[1])}/ ・ ${esc(e[2])}</div><button type="button" class="primary-link external-game-play" data-study-next>${esc(s.qi+1>=s.deck.length?t("studyResult"):t("studyNext"))}</button>`;
    }
    return `${head}<div class="mj-bar"><span>${s.qi+1} / ${s.deck.length} ${esc(t("studyOf"))}</span><span>${esc(t("rhScore"))}: ${s.score}</span><span>${esc(t("studyStreak"))} ${s.streak}</span></div>${qHtml}<div class="st-opts">${opts}</div>${feedback}`;
  }

  }
  if(s.screen==="cards"){
    const e=DICT[s.deck[s.cardIdx]];
    const body=s.flipped
      ?`<div class="st-q nu-font">${esc(e[4])}</div><div class="st-cardback">${esc(e[0])} /${esc(e[1])}/<br>${esc(e[2])}</div>`
      :`<div class="st-q nu-font">${esc(e[4])}</div><div class="st-hint">${esc(t("studyTapCard"))}</div>`;
    return `${head}<div class="mj-bar"><span>${s.cardIdx+1} / ${s.deck.length}</span><span>${esc(e[3])}</span></div><button type="button" class="st-card st-flash" data-study-flip>${body}</button><div class="bj-actions"><button type="button" class="bj-btn" data-study-cardnav="-1">${esc(t("studyPrev"))}</button><button type="button" class="bj-btn" data-study-reshuffle>${esc(t("studyShuffle"))}</button><button type="button" class="bj-btn bj-btn-primary" data-study-cardnav="1">${esc(t("studyNextCard"))}</button></div><div class="bj-actions"><button type="button" class="bj-btn" data-study-home>${esc(t("studyHome"))}</button></div>`;
  }
  // home
  const modes=[["nu2ja","studyModeNuJa"],["ja2nu","studyModeJaNu"],["nu2lat","studyModeNuLat"],["cards","studyModeCards"]];
  const modeChips=modes.map(([m,k])=>`<button type="button" class="st-chip ${s.mode===m?"on":""}" data-study-mode="${m}">${esc(t(k))}</button>`).join("");
  const cats=["all"].concat(DICT_CATS);
  const catChips=cats.map(c=>`<button type="button" class="st-chip ${s.cat===c?"on":""}" data-study-cat="${esc(c)}">${esc(c==="all"?t("studyAll"):c)}</button>`).join("");
  const best=studyBest();
  const bestLines=modes.slice(0,3).map(([m,k])=>{
    const v=best[m+"|"+s.cat];
    return v?`<span>${esc(t(k))}: ${v}/10</span>`:"";
  }).filter(Boolean).join(" ・ ");
  return `${head}<p class="page-subtitle">${esc(t("studyIntro"))}</p><div class="st-label">${esc(t("studyMode"))}</div><div class="st-chips">${modeChips}</div><div class="st-label">${esc(t("dictionary"))} / ${esc(t("studyCat"))}</div><div class="st-chips">${catChips}</div>${bestLines?`<p class="footnote">${esc(t("studyBest"))}: ${bestLines}</p>`:""}<button type="button" class="primary-link external-game-play" data-study-start>${esc(t("studyStart"))}</button>`;
}
app.addEventListener("click",event=>{
  const mEl=event.target.closest("[data-study-mode]");
  if(mEl&&studyState){studyState.mode=mEl.dataset.studyMode;render();return}
  const cEl=event.target.closest("[data-study-cat]");
  if(cEl&&studyState){studyState.cat=cEl.dataset.studyCat;render();return}
  if(event.target.closest("[data-study-start]")&&studyState){
    if(studyState.mode==="cards")studyStartCards();else studyStartQuiz();
    return;
  }
  const oEl=event.target.closest("[data-study-opt]");
  if(oEl){studyAnswer(Number(oEl.dataset.studyOpt));return}
  if(event.target.closest("[data-study-next]")){studyNext();return}
  if(event.target.closest("[data-study-again]")&&studyState){studyStartQuiz();return}
  if(event.target.closest("[data-study-home]")&&studyState){studyState.screen="home";render();return}
  if(event.target.closest("[data-study-flip]")&&studyState){studyState.flipped=!studyState.flipped;render();return}
  if(event.target.closest("[data-study-reshuffle]")&&studyState){studyStartCards();return}
  const nEl=event.target.closest("[data-study-cardnav]");
  if(nEl&&studyState){
    const d=Number(nEl.dataset.studyCardnav);
    studyState.cardIdx=(studyState.cardIdx+d+studyState.deck.length)%studyState.deck.length;
    studyState.flipped=false;
    render();return;
  }
});
// ================= 内蔵ゲーム: 麻雀ソリティア / リズム / アーチャー =================
// ---------- 麻雀（4人打ちリーチ麻雀） ----------
const MJ2_NAMES=["1萬","2萬","3萬","4萬","5萬","6萬","7萬","8萬","9萬","1筒","2筒","3筒","4筒","5筒","6筒","7筒","8筒","9筒","1索","2索","3索","4索","5索","6索","7索","8索","9索","東","南","西","北","白","發","中"];
const MJ2_WINDS=["東","南","西","北"];
let mj2=null,mj2Timer=0;
function mj2Kind(t){return t>=34?[4,13,22][t-34]:t}
function mj2IsRed(t){return t>=34}
function mj2Counts(hand){const c=new Array(34).fill(0);for(const t of hand)c[mj2Kind(t)]++;return c}
function mj2SortHand(hand){hand.sort((a,b)=>mj2Kind(a)-mj2Kind(b)||a-b)}
function mj2IsTerm(k){return k>=27||k%9===0||k%9===8}
function mj2Shuffle(a){for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function mj2ShantenReg(c0){
  let best=8;const c=c0.slice();
  function rec(pos,m,t,pair){
    while(pos<34&&c[pos]===0)pos++;
    if(pos>=34){let tt=t;if(m+tt>4)tt=4-m;const sh=8-2*m-tt-(pair?1:0);if(sh<best)best=sh;return}
    if(c[pos]>=3){c[pos]-=3;rec(pos,m+1,t,pair);c[pos]+=3}
    if(pos<27&&pos%9<=6&&c[pos+1]>0&&c[pos+2]>0){c[pos]--;c[pos+1]--;c[pos+2]--;rec(pos,m+1,t,pair);c[pos]++;c[pos+1]++;c[pos+2]++}
    if(!pair&&c[pos]>=2){c[pos]-=2;rec(pos,m,t,true);c[pos]+=2}
    if(c[pos]>=2){c[pos]-=2;rec(pos,m,t+1,pair);c[pos]+=2}
    if(pos<27&&pos%9<=7&&c[pos+1]>0){c[pos]--;c[pos+1]--;rec(pos,m,t+1,pair);c[pos]++;c[pos+1]++}
    c[pos]--;rec(pos,m,t,pair);c[pos]++
  }
  rec(0,0,0,false);
  return best;
}
function mj2Shanten(counts){
  let best=mj2ShantenReg(counts);
  let pairs=0,uniq=0;
  for(let k=0;k<34;k++){if(counts[k]>0)uniq++;if(counts[k]>=2)pairs++}
  best=Math.min(best,6-pairs+(uniq<7?7-uniq:0));
  let th=0,hasPair=false;
  for(let k=0;k<34;k++){if(mj2IsTerm(k)&&counts[k]>0){th++;if(counts[k]>=2)hasPair=true}}
  best=Math.min(best,13-th-(hasPair?1:0));
  return best;
}
function mj2Waits(counts){
  const waits=[];
  for(let k=0;k<34;k++){
    if(counts[k]>=4)continue;
    counts[k]++;
    if(mj2Shanten(counts)===-1)waits.push(k);
    counts[k]--;
  }
  return waits;
}
function mj2NewGame(){
  mj2={scores:[25000,25000,25000,25000],hand:0,honba:0,kyotaku:0,over:false,result:null};
  mj2StartHand();
}
function mj2Dealer(){return mj2.hand%4}
function mj2SeatWind(p){return (p-mj2Dealer()+4)%4}
function mj2StartHand(){
  const s=mj2;
  const wall=[];
  for(let k=0;k<34;k++)for(let i=0;i<4;i++)wall.push(k);
  for(const [kind,red] of [[4,34],[13,35],[22,36]]){const i=wall.indexOf(kind);wall[i]=red}
  mj2Shuffle(wall);
  s.wall=wall.slice(0,122);
  s.dead=wall.slice(122);
  s.doraInd=[s.dead[4]];
  s.uraInd=[s.dead[5]];
  s.kanCount=0;
  s.players=[];
  for(let p=0;p<4;p++){
    s.players.push({hand:[],melds:[],discards:[],riichi:false,riichiTurn:-1,ippatsu:false,furiten:false,drawn:null});
  }

  for(const pl of s.players)mj2SortHand(pl.hand);
  s.turn=mj2Dealer();
  s.riichiChoosing=false;
  s.phase="draw";
  s.prompt=null;
  s.lastDiscard=null;
  s.result=null;
  s.turnCount=0;
  render();
  mj2Draw();
}
function mj2NextDora(ind){
  const k=mj2Kind(ind);
  return k>=27?(k>=31?(k===33?31:k+1):(k===30?27:k+1)):(k%9===8?k-8:k+1);
}
function mj2DoraTiles(){
  return mj2.doraInd.map(mj2NextDora);
}
function mj2CountDora(p,ura){
  const s=mj2;

  const doraTiles=inds.map(mj2NextDora);

  const all=pl.hand.concat(pl.melds.flatMap(m=>m.tiles));

function mj2Draw(){

  const t=s.wall.pop();
  pl.drawn=t;pl.hand.push(t);
  s.phase="discard";
  render();
  if(s.turn===0){
    if(pl.riichi){
      mj2Timer=setTimeout(()=>{if(mj2&&mj2.phase==="discard"&&mj2.turn===0){
        if(mj2HasYakuTsumo(0)){mj2Win(0,null,true);return}
        mj2DoDiscard(0,pl.hand.length-1);
      }},650);
    }
    return;
  }
  mj2Timer=setTimeout(()=>mj2CpuAct(s.turn),430);
}
function mj2CanTsumo(p){

}
function mj2CanRon(p,tile){

function mj2HasYakuTsumo(p){

}
function mj2DoDiscard(p,idx){
  const s=mj2;
  const pl=s.players[p];
  const t=pl.hand.splice(idx,1)[0];
  pl.drawn=null;
  pl.discards.push(t);
  if(pl.riichi&&pl.riichiTurn<0){pl.riichiTurn=s.turnCount;pl.ippatsu=true}
  else if(pl.riichi&&pl.ippatsu&&pl.riichiTurn<s.turnCount)pl.ippatsu=false;

function mj2CallCheck(from,tile,step){
  const s=mj2;
  // step 1..3: players in turn order after 'from'
  while(step<=3){
    const p=(from+step)%4;
    const pl=s.players[p];
    if(mj2CanRon(p,tile)){
      if(p===0){
        s.prompt={type:"ron",tile,from,step,canPon:mj2Counts(pl.hand)[mj2Kind(tile)]>=2,canKan:mj2Counts(pl.hand)[mj2Kind(tile)]>=3};
        render();return;
      }
      mj2Win(p,{tile,from},false);return;
    }
    step++;
  }
  // pon / kan
  for(let k=1;k<=3;k++){
    const p=(from+k)%4;
    const pl=s.players[p];
    const cnt=mj2Counts(pl.hand)[mj2Kind(tile)];
    if(cnt>=2){
      if(p===0){
        s.prompt={type:"pon",tile,from,canPon:true,canKan:cnt>=3};
        render();return;
      }
      if(mj2CpuWantsPon(p,tile)){mj2DoPon(p,from,tile);return}
    }
  }
  // chi: only next player
  const np=(from+1)%4;
  const npl=s.players[np];
  const seqs=mj2ChiOptions(npl.hand,tile);
  if(seqs.length){
    if(np===0){s.prompt={type:"chi",tile,from,options:seqs};render();return}
    const chosen=mj2CpuWantsChi(np,tile,seqs);
    if(chosen){mj2DoChi(np,from,tile,chosen);return}
  }
  mj2NextTurn(from);
}
function mj2NextTurn(from){
  const s=mj2;
  s.turn=(from+1)%4;
  s.turnCount++;
  s.phase="draw";
  mj2Draw();
}
function mj2ChiOptions(hand,tile){
  const c=mj2Counts(hand);
  const opts=[];
  tile=mj2Kind(tile);
  if(tile<27){
    const base=tile-(tile%9);
    for(const [a,b] of [[tile-2,tile-1],[tile-1,tile+1],[tile+1,tile+2]]){
      if(a<base||b>base+8)continue;
      if(c[a]>0&&c[b]>0)opts.push([a,b]);
    }
  }

}
function mj2TakeFromDiscard(from){
  const s=mj2;
  const dpl=s.players[from];
  dpl.discards.pop();
}
function mj2DoPon(p,from,tile){
  const s=mj2;
  mj2TakeFromDiscard(from);
  const pl=s.players[p];
  const kind=mj2Kind(tile);
  const taken=[];
  pl.hand=pl.hand.filter(x=>{if(mj2Kind(x)===kind&&taken.length<2){taken.push(x);return false}return true});
  pl.melds.push({type:"pon",tiles:taken.concat([tile]),open:true,from});
  s.turn=p;s.phase="discard";pl.drawn=null;
  render();
  if(p!==0)mj2Timer=setTimeout(()=>mj2CpuAct(p),430);
}
function mj2DoChi(p,from,tile,pair){
  const s=mj2;
  mj2TakeFromDiscard(from);
  const pl=s.players[p];
  const taken=[];
  for(const pt of pair){
    const i=pl.hand.findIndex(x=>mj2Kind(x)===pt);
    taken.push(pl.hand[i]);
    pl.hand.splice(i,1);
  }
  pl.melds.push({type:"chi",tiles:taken.concat([tile]).sort((a,b)=>mj2Kind(a)-mj2Kind(b)),open:true,from});
  s.turn=p;s.phase="discard";pl.drawn=null;
  render();
  if(p!==0)mj2Timer=setTimeout(()=>mj2CpuAct(p),430);
}
function mj2DoKan(p,from,tile){
  const s=mj2;
  const pl=s.players[p];
  if(from!==null&&from!==undefined){
    mj2TakeFromDiscard(from);
    const kind=mj2Kind(tile);
    const taken=[];
    pl.hand=pl.hand.filter(x=>{if(mj2Kind(x)===kind&&taken.length<3){taken.push(x);return false}return true});
    pl.melds.push({type:"kan",tiles:taken.concat([tile]),open:true,from});
  }else{
    const taken=[];
    pl.hand=pl.hand.filter(x=>{if(mj2Kind(x)===tile&&taken.length<4){taken.push(x);return false}return true});
    pl.melds.push({type:"kan",tiles:taken,open:false,from:p});
  }
  s.kanCount++;
  s.doraInd.push(s.dead[4+s.kanCount*2]);
  s.uraInd.push(s.dead[5+s.kanCount*2]);
  // rinshan draw from the dead wall
  const rt=s.dead.shift();
  pl.drawn=rt;pl.hand.push(rt);
  s.turn=p;s.phase="discard";
  render();
  if(p!==0)mj2Timer=setTimeout(()=>mj2CpuAct(p),430);
  else if(pl.riichi)mj2Timer=setTimeout(()=>{if(mj2&&mj2.turn===0&&mj2.phase==="discard"){if(mj2HasYakuTsumo(0)){mj2Win(0,null,true);return}mj2DoDiscard(0,pl.hand.length-1)}},650);
}
function mj2CpuWantsPon(p,tile){
  const pl=mj2.players[p];
  if(pl.riichi)return false;
  const c=mj2Counts(pl.hand);
  const before=mj2Shanten(c);
  c[mj2Kind(tile)]-=2;
  tile=mj2Kind(tile);
  const after=mj2Shanten(c);
  const isYakuhai=tile>=31||tile===27+mj2SeatWind(p)||tile===27;
  return after<before||isYakuhai;
}
function mj2CpuWantsChi(p,tile,seqs){
  const pl=mj2.players[p];
  if(pl.riichi)return null;
  const before=mj2Shanten(mj2Counts(pl.hand));
  for(const pr of seqs){
    const c=mj2Counts(pl.hand);
    c[pr[0]]--;c[pr[1]]--;
    if(mj2Shanten(c)<before)return pr;
  }
  return null;
}
function mj2CpuDiscardIndex(p){
  const pl=mj2.players[p];
  const hand=pl.hand;
  let bestIdx=hand.length-1,bestSh=99,bestScore=-1e9;
  const seen=new Set();
  for(let i=0;i<hand.length;i++){
    const t=hand[i];
    if(seen.has(t))continue;
    seen.add(t);
    const rest=hand.filter((_,j)=>j!==i);
    const sh=mj2Shanten(mj2Counts(rest));
    let score=-sh*100;
    if(mj2IsTerm(mj2Kind(t)))score+=6;
    if(t>=27)score+=4;
    const c=mj2Counts(rest);
    let conn=0;
    for(let d=-2;d<=2;d++){const k=t+d;if(k>=0&&k<34&&c[k]>0)conn+=c[k]}
    score-=conn*3;
    score-=mj2CountDoraKind(t)*2;
    if(sh<bestSh||(sh===bestSh&&score>bestScore)){bestSh=sh;bestScore=score;bestIdx=i}
  }
  return bestIdx;
}
function mj2CountDoraKind(t){
  return mj2DoraTiles().filter(d=>d===mj2Kind(t)).length+(mj2IsRed(t)?1:0);
}
function mj2CpuAct(p){
  const s=mj2;
  if(!s||s.phase!=="discard"||s.turn!==p)return;
  const pl=s.players[p];
  if(mj2HasYakuTsumo(p)){mj2Win(p,null,true);return}
  // closed kan?
  const c=mj2Counts(pl.hand);
  for(let k=0;k<34;k++){
    if(c[k]===4&&!pl.riichi){mj2DoKan(p,null,k);return}
  }
  // riichi?
  if(!pl.riichi&&pl.melds.every(m=>!m.open)&&s.scores[p]>=1000){
    for(let i=0;i<pl.hand.length;i++){
      const rest=pl.hand.filter((_,j)=>j!==i);
      if(mj2Shanten(mj2Counts(rest))===0){
        pl.riichi=true;s.scores[p]-=1000;s.kyotaku++;
        mj2DoDiscard(p,i);return;
      }
    }
  }
  if(pl.riichi){mj2DoDiscard(p,pl.hand.length-1);return}
  mj2DoDiscard(p,mj2CpuDiscardIndex(p));
}
// ----- scoring -----
function mj2Decompose(counts,meldSets){
  const results=[];
  const c=counts.slice();
  function rec(sets){
    let i=0;
    while(i<34&&c[i]===0)i++;
    if(i>=34){results.push(sets.slice());return}
    if(c[i]>=3){c[i]-=3;sets.push({kind:i,type:"kou",concealed:true});rec(sets);sets.pop();c[i]+=3}
    if(i<27&&i%9<=6&&c[i+1]>0&&c[i+2]>0){c[i]--;c[i+1]--;c[i+2]--;sets.push({kind:i,type:"shun",concealed:true});rec(sets);sets.pop();c[i]++;c[i+1]++;c[i+2]++}
  }
  for(let pair=0;pair<34;pair++){
    if(c[pair]>=2){c[pair]-=2;rec([{kind:pair,type:"pair",concealed:true}]);c[pair]+=2}
  }
  return results.map(sets=>sets.concat(meldSets));
}
function mj2Score(p,winTile,tsumo,fromPlayer){
  const winTileRaw=winTile;
  winTile=mj2Kind(winTile);
  const s=mj2;
  const pl=s.players[p];
  const dealer=mj2Dealer()===p;
  const seatWind=mj2SeatWind(p);
  const menzen=pl.melds.every(m=>!m.open);
  const hand14=pl.hand.slice();
  if(!tsumo)hand14.push(winTile);
  const counts=mj2Counts(hand14);
  let dora;
  if(tsumo)dora=mj2CountDora(p,pl.riichi);
  else{pl.hand.push(winTileRaw);dora=mj2CountDora(p,pl.riichi);pl.hand.pop()}
  // kokushi
  let best=null;
  const terms=[0,8,9,17,18,26,27,28,29,30,31,32,33];
  if(pl.melds.length===0&&terms.every(k=>counts[k]>=1)&&terms.some(k=>counts[k]>=2)){
    const han=13;
    best={han,fu:0,yaku:[[lang==="ja"?"国士無双":"Kokushi Musou",0]],yakuman:1};
  }
  // chiitoitsu
  if(!best&&pl.melds.length===0){
    let pairs=0;for(let k=0;k<34;k++)if(counts[k]===2)pairs++;
    if(pairs===7){
      const yaku=[[lang==="ja"?"七対子":"Chiitoitsu",2]];
      if(pl.riichi)yaku.push([lang==="ja"?"リーチ":"Riichi",1]);
      if(tsumo&&menzen)yaku.push([lang==="ja"?"門前清自摸和":"Menzen Tsumo",1]);
      let allTerm=true,allSimple=true,suit=-1,oneSuit=true;
      for(let k=0;k<34;k++){if(counts[k]===2){if(!mj2IsTerm(k))allTerm=false;else allSimple=false;const su=k<27?(k/9|0):-1;if(su===-1)oneSuit=false;else if(suit===-1)suit=su;else if(suit!==su)oneSuit=false}}
      if(allTerm)yaku.push([lang==="ja"?"混老頭":"Honchantai",2]);
      else if(allSimple)yaku.push([lang==="ja"?"断ヤオ九":"Tanyao",1]);
      if(oneSuit)yaku.push([lang==="ja"?"混一色":"Honitsu",3]);
      let han=yaku.reduce((a,y)=>a+y[1],0);
      best={han:han,fu:25,yaku,chiitoi:true};
    }
  }
  if(!best){
    const meldSets=pl.melds.map(m=>{
      if(m.type==="chi")return {kind:m.tiles[0],type:"shun",concealed:false};
      if(m.type==="kan")return {kind:m.tiles[0],type:"kou",concealed:!m.open,kan:true};
      return {kind:m.tiles[0],type:"kou",concealed:!m.open};
    });
    const handCounts=mj2Counts(pl.hand);
    if(!tsumo)handCounts[winTile]++;
    const decomps=mj2Decompose(handCounts,meldSets);
    for(const sets of decomps){
      const ev=mj2EvalSets(p,sets,winTile,tsumo,menzen,seatWind);
      if(!ev)continue;
      if(!best||ev.han>best.han||(ev.han===best.han&&ev.fu>best.fu))best=ev;
    }
  }
  if(!best)return null;
  if(best.yakuman){
    if(tsumo)best.points=dealer?{all:16000}:{dealer:16000,other:8000};
    else best.points={ron:dealer?48000:32000};
    best.total=dealer?48000:32000;
    best.dora=0;best.dealer=dealer;
    return best;
  }
  best.dora=dora;
  best.han+=dora;
  if(dora>0)best.yaku.push([lang==="ja"?"ドラ":"Dora",dora]);
  const han=best.han,fu=best.fu;
  let base;
  if(han>=13)base=8000;
  else if(han>=11)base=6000;
  else if(han>=8)base=4000;
  else if(han>=6)base=3000;
  else if(han>=5)base=2000;
  else base=Math.min(2000,fu*Math.pow(2,2+han));
  const ceil100=x=>Math.ceil(x/100)*100;
  if(tsumo){
    if(dealer)best.points={all:ceil100(base*2)};
    else best.points={dealer:ceil100(base*2),other:ceil100(base)};
    best.total=dealer?base*6:base*4;
  }else{
    best.points={ron:ceil100(base*(dealer?6:4))};
    best.total=ceil100(base*(dealer?6:4));
  }
  best.dealer=dealer;
  return best;
}
function mj2EvalSets(p,sets,winTile,tsumo,menzen,seatWind){
  const ja=lang==="ja";
  const yaku=[];
  const pl=mj2.players[p];
  const pair=sets.find(x=>x.type==="pair");
  const mentsu=sets.filter(x=>x.type!=="pair");
  if(mentsu.length!==4||!pair)return null;
  const allKinds=[];
  for(const st of sets){
    if(st.type==="pair")allKinds.push(st.kind,st.kind);
    else if(st.type==="kou")allKinds.push(st.kind,st.kind,st.kind);
    else allKinds.push(st.kind,st.kind+1,st.kind+2);
  }
  // wait type for the winning set
  let waitType="ryanmen";
  if(!tsumo){
    for(const st of mentsu){
      if(st.type==="kou"&&st.kind===winTile){waitType="shanpon";break}
      if(st.type==="shun"){
        if(winTile===st.kind+1)waitType="kanchan";
        else if((winTile===st.kind+2&&st.kind%9===0)||(winTile===st.kind&&st.kind%9===6))waitType="penchan";
        else if(winTile===st.kind||winTile===st.kind+2)waitType="ryanmen";
        if(winTile>=st.kind&&winTile<=st.kind+2)break;
      }
    }
    if(pair.kind===winTile&&waitType==="ryanmen")waitType="tanki";
  }
  const isPinfu=mentsu.every(x=>x.type==="shun")&&!(pair.kind>=31)&&pair.kind!==27+seatWind&&pair.kind!==27&&waitType==="ryanmen";
  const hasHonor=allKinds.some(k=>k>=27);
  if(pl.riichi)yaku.push([ja?"リーチ":"Riichi",1]);
  if(pl.riichi&&pl.ippatsu)yaku.push([ja?"一発":"Ippatsu",1]);
  if(tsumo&&menzen)yaku.push([ja?"門前清自摸和":"Menzen Tsumo",1]);
  if(isPinfu&&menzen)yaku.push([ja?"平和":"Pinfu",1]);
  if(allKinds.every(k=>!mj2IsTerm(k)))yaku.push([ja?"断ヤオ九":"Tanyao",1]);
  // yakuhai
  for(const st of mentsu){
    if(st.type==="kou"){
      if(st.kind>=31)yaku.push([ja?"役牌":"Yakuhai",1]);
      if(st.kind===27)yaku.push([ja?"役牌・場風":"Yakuhai (Prevalent)",1]);
      if(st.kind===27+seatWind)yaku.push([ja?"役牌・自風":"Yakuhai (Seat)",1]);
    }
  }
  // iipeikou / ryanpeikou (menzen)
  if(menzen){
    const shuns=mentsu.filter(x=>x.type==="shun").map(x=>x.kind);
    const cnt={};for(const k of shuns)cnt[k]=(cnt[k]||0)+1;
    const pairsOf=Object.values(cnt).filter(v=>v>=2).length;
    const quads=Object.values(cnt).some(v=>v>=4);
    if(quads||pairsOf>=2)yaku.push([ja?"二盃口":"Ryanpeikou",3]);
    else if(pairsOf===1)yaku.push([ja?"一盃口":"Iipeikou",1]);
  }
  if(mentsu.every(x=>x.type==="kou"))yaku.push([ja?"対々和":"Toitoi",2]);
  let ankou=mentsu.filter(x=>x.type==="kou"&&x.concealed).length;
  if(!tsumo&&mentsu.some(x=>x.type==="kou"&&x.concealed&&x.kind===winTile))ankou--;
  if(ankou>=3)yaku.push([ja?"三暗刻":"Sanankou",2]);
  // suits
  const suits=new Set(allKinds.map(k=>k<27?(k/9|0):-1));
  const suitOnly=[...suits].filter(x=>x>=0);
  if(suitOnly.length===1&&hasHonor)yaku.push([ja?"混一色":"Honitsu",menzen?3:2]);
  if(suitOnly.length===1&&!hasHonor)yaku.push([ja?"清一色":"Chinitsu",menzen?6:5]);
  const setHasTerm=st=>st.type==="kou"?mj2IsTerm(st.kind):st.type==="shun"?(mj2IsTerm(st.kind)||mj2IsTerm(st.kind+2)):mj2IsTerm(st.kind);
  const allSetsTerm=sets.every(setHasTerm);
  if(allKinds.every(k=>mj2IsTerm(k)))yaku.push([ja?"混老頭":"Honchantai",2]);
  else if(allSetsTerm&&!hasHonor)yaku.push([ja?"純全帯ヤオ九":"Junchan",menzen?3:2]);
  else if(allSetsTerm)yaku.push([ja?"混全帯ヤオ九":"Honchan",menzen?2:1]);
  // ittsu
  for(let su=0;su<3;su++){
    const starts=mentsu.filter(x=>x.type==="shun"&&(x.kind/9|0)===su).map(x=>x.kind%9);
    if(starts.includes(0)&&starts.includes(3)&&starts.includes(6)){yaku.push([ja?"一気通貫":"Ittsu",menzen?2:1]);break}
  }
  // sanshoku doujun
  const shunStarts=mentsu.filter(x=>x.type==="shun").map(x=>x.kind);
  for(const st of shunStarts){
    if(st>=9)continue;
    const n=st%9;
    if(shunStarts.includes(n+9)&&shunStarts.includes(n+18)){yaku.push([ja?"三色同順":"Sanshoku Doujun",menzen?2:1]);break}
  }
  // shousangen
  const dragonKou=mentsu.filter(x=>x.type==="kou"&&x.kind>=31).length;
  if(dragonKou===2&&pair.kind>=31)yaku.push([ja?"小三元":"Shousangen",2]);
  let han=yaku.reduce((a,y)=>a+y[1],0);
  if(han===0)return null;
  // fu
  let fu=20;
  if(!tsumo&&menzen)fu+=10;
  if(tsumo&&!isPinfu)fu+=2;
  let ronKouUsed=false;
  for(const st of mentsu){
    if(st.type==="kou"){
      let v=mj2IsTerm(st.kind)?8:4;
      let conc=st.concealed;
      if(!tsumo&&conc&&st.kind===winTile&&!ronKouUsed){conc=false;ronKouUsed=true}
      if(!conc)v/=2;
      if(st.kan)v*=4;
      fu+=v;
    }
  }
  let pairFu=0;
  if(pair.kind>=31)pairFu+=2;
  if(pair.kind===27)pairFu+=2;
  if(pair.kind===27+seatWind)pairFu+=2;
  fu+=pairFu;
  if(waitType==="kanchan"||waitType==="penchan"||waitType==="tanki")fu+=2;
  fu=Math.ceil(fu/10)*10;
  if(isPinfu)fu=menzen?(tsumo?20:30):30;
  else if(fu<30)fu=30;
  return {han,fu,yaku};
}
function mj2Win(p,ronInfo,tsumo){
  const s=mj2;
  const sc=mj2Score(p,tsumo?mj2.players[p].drawn:ronInfo.tile,tsumo,ronInfo?ronInfo.from:null);
  if(!sc){ // no yaku: cannot win; continue play
    if(tsumo){s.phase="discard";render();if(p!==0)mj2Timer=setTimeout(()=>mj2CpuAct(p),430)}
    else if(ronInfo)mj2NextTurn(ronInfo.from);
    return;
  }
  const dealer=sc.dealer;
  const payments=[];
  if(tsumo){
    for(let q=0;q<4;q++){
      if(q===p)continue;
      let amt;
      if(dealer)amt=sc.points.all+s.honba*100;
      else amt=(q===mj2Dealer()?sc.points.dealer:sc.points.other)+s.honba*100;
      s.scores[q]-=amt;s.scores[p]+=amt;
      payments.push([q,amt]);
    }
  }else{
    const amt=sc.points.ron+s.honba*300;
    s.scores[ronInfo.from]-=amt;s.scores[p]+=amt;
    payments.push([ronInfo.from,amt]);
  }
  s.scores[p]+=s.kyotaku*1000;
  const kyotakuTaken=s.kyotaku;
  s.kyotaku=0;
  s.result={type:"win",winner:p,tsumo,from:ronInfo?ronInfo.from:null,score:sc,payments,kyotaku:kyotakuTaken,dealerStay:dealer};
  s.phase="handend";
  render();
}
function mj2Ryuukyoku(){
  const s=mj2;
  const tenpai=[0,1,2,3].map(p=>mj2Shanten(mj2Counts(s.players[p].hand))===0);
  const n=tenpai.filter(Boolean).length;
  const payments=[];
  if(n>0&&n<4){
    for(let p=0;p<4;p++){
      const amt=tenpai[p]?(3000/n):(-3000/(4-n));
      s.scores[p]+=amt;payments.push([p,amt]);
    }
  }
  s.result={type:"ryuukyoku",tenpai,payments,dealerStay:tenpai[mj2Dealer()]};
  s.phase="handend";
  render();
}
function mj2NextHand(){
  const s=mj2;
  if(s.result&&s.result.type==="win"&&s.result.dealerStay){s.honba++}
  else if(s.result&&s.result.type==="ryuukyoku"){s.honba++;if(!s.result.dealerStay)s.hand++}
  else{s.hand++;s.honba=0}
  if(s.hand>=4){s.over=true;s.result={type:"gameover"};render();return}
  mj2StartHand();
}

app.addEventListener("click",event=>{
  if(event.target.closest("[data-mj2-start]")){clearTimeout(mj2Timer);mj2NewGame();return}
  if(event.target.closest("[data-mj2-next]")){mj2NextHand();return}
  const act=event.target.closest("[data-mj2-act]");
  if(act&&mj2){
    const a=act.dataset.mj2Act;
    const s=mj2;
    if(a==="tsumo"){mj2Win(0,null,true);return}
    if(a==="riichi"){s.riichiChoosing=true;render();return}
    if(a==="kan"){mj2DoKan(0,null,Number(act.dataset.mj2Tile));return}
    if(a==="ron"&&s.prompt){const pr=s.prompt;s.prompt=null;mj2Win(0,{tile:pr.tile,from:pr.from},false);return}
    if(a==="pon"&&s.prompt){const pr=s.prompt;s.prompt=null;mj2DoPon(0,pr.from,pr.tile);return}
    if(a==="minkan"&&s.prompt){const pr=s.prompt;s.prompt=null;mj2DoKan(0,pr.from,pr.tile);return}
    if(a==="chi"&&s.prompt){const pr=s.prompt;const opt=pr.options[Number(act.dataset.mj2Opt)];s.prompt=null;mj2DoChi(0,pr.from,pr.tile,opt);return}
    if(a==="pass"&&s.prompt){
      const pr=s.prompt;s.prompt=null;
      if(pr.type==="ron"){s.players[0].furiten=true;mj2CallCheck(pr.from,pr.tile,pr.step+1);return}
      // pon/chi passed: continue with chi check then next turn
      mj2PassContinue(pr);
      return;
    }
    return;
  }
  const dt=event.target.closest("[data-mj2-discard]");
  if(dt&&mj2&&mj2.turn===0&&mj2.phase==="discard"){
    const idx=Number(dt.dataset.mj2Discard);
    const s=mj2,pl=s.players[0];
    if(s.riichiChoosing){
      const rest=pl.hand.filter((_,j)=>j!==idx);
      if(mj2Shanten(mj2Counts(rest))!==0)return;
      pl.riichi=true;s.scores[0]-=1000;s.kyotaku++;
      s.riichiChoosing=false;
      mj2DoDiscard(0,idx);
      return;
    }
    mj2DoDiscard(0,idx);
  }
});
function mj2PassContinue(pr){
  const s=mj2;
  const from=pr.from,tile=pr.tile;
  if(pr.type==="pon"){
    for(let k=1;k<=3;k++){
      const p=(from+k)%4;
      if(p===0)continue;
      if(mj2Counts(s.players[p].hand)[tile]>=2&&mj2CpuWantsPon(p,tile)){mj2DoPon(p,from,tile);return}
    }
  }
  const np=(from+1)%4;
  if(pr.type==="pon"&&np!==0){
    const npl=s.players[np];
    const seqs=mj2ChiOptions(npl.hand,tile);
    if(seqs.length){
      const chosen=mj2CpuWantsChi(np,tile,seqs);
      if(chosen){mj2DoChi(np,from,tile,chosen);return}
    }
  }
  mj2NextTurn(from);
}

    if(!n.judge&&now-n.t>0.18){n.judge="m";rhState.counts.m++;rhState.combo=0}
  }
  const els=stage.querySelectorAll(".rh-note");
  rhState.notes.forEach((n,i)=>{
    const el=els[i];if(!el)return;
    const dt=n.t-now;
    if(n.judge||dt>RH_TRAVEL||dt<-0.2){el.style.display="none";return}
    el.style.display="block";
    el.style.top=(((RH_TRAVEL-dt)/RH_TRAVEL)*80)+"%";
  });
  const sc=document.getElementById("rhScore");if(sc)sc.textContent=rhState.score;
  const cb=document.getElementById("rhCombo");if(cb)cb.textContent=rhState.combo;
  const ld=document.getElementById("rhLoad");
  if(ld)ld.textContent=rhState.err?t("rhLoadError"):rhState.loading?t("rhLoading"):"";
  const jd=document.getElementById("rhJudge");
  if(jd&&rhState.judge&&performance.now()-rhState.judgeAt<450){jd.textContent=rhState.judge;jd.style.opacity="1"}else if(jd){jd.style.opacity="0"}
  if(now>=RH_SONGS[rhState.song].dur+0.5){rhFinish();return}
  rhRAF=requestAnimationFrame(rhFrame);
}
function rhHit(lane){
  if(!rhState||!rhState.playing||rhState.loading)return;
  const now=rhNow();
  let best=null,bestDt=1e9;
  for(const n of rhState.notes){
    if(n.judge||n.lane!==lane)continue;
    const dt=Math.abs(now-n.t);
    if(dt<bestDt){bestDt=dt;best=n}
  }
  const laneEl=document.querySelector(`[data-rh-lane="${lane}"]`);
  if(laneEl){laneEl.classList.remove("rh-hit");void laneEl.offsetWidth;laneEl.classList.add("rh-hit")}
  if(!best||bestDt>0.18)return;
  if(bestDt<=0.09){best.judge="p";rhState.counts.p++;rhState.score+=300;rhState.judge="PERFECT"}
  else{best.judge="g";rhState.counts.g++;rhState.score+=100;rhState.judge="GOOD"}
  rhState.combo++;rhState.maxCombo=Math.max(rhState.maxCombo,rhState.combo);
  rhState.judgeAt=performance.now();
}

// ----- sound engine (layered synth) -----
let arAC=null,arMaster=null,arNoiseBuf=null,arLastShootSfx=0,arLastDieSfx=0,arLastHitSfx=0;
function arAudio(){
  if(!arAC){
    try{
      arAC=new (window.AudioContext||window.webkitAudioContext)();
      const comp=arAC.createDynamicsCompressor();
      comp.threshold.value=-18;comp.ratio.value=6;
      arMaster=arAC.createGain();arMaster.gain.value=0.9;
      arMaster.connect(comp);comp.connect(arAC.destination);
      const len=arAC.sampleRate*0.5;
      arNoiseBuf=arAC.createBuffer(1,len,arAC.sampleRate);
      const d=arNoiseBuf.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    }catch(_){ }
  }
  if(arAC&&arAC.state==="suspended")arAC.resume();
  return arAC;
}
function arTone(f0,f1,dur,type,vol,delay){
  const ac=arAudio();if(!ac)return;
  const t0=ac.currentTime+(delay||0);
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||"square";
  o.frequency.setValueAtTime(Math.max(30,f0),t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t0+dur);
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(arMaster);
  o.start(t0);o.stop(t0+dur+0.02);
}
function arNoise(dur,ftype,f0,f1,vol,delay){
  const ac=arAudio();if(!ac||!arNoiseBuf)return;
  const t0=ac.currentTime+(delay||0);
  const src=ac.createBufferSource();src.buffer=arNoiseBuf;src.loop=true;
  const fl=ac.createBiquadFilter();fl.type=ftype;
  fl.frequency.setValueAtTime(f0,t0);
  fl.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t0+dur);
  const g=ac.createGain();
  g.gain.setValueAtTime(vol,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  src.connect(fl);fl.connect(g);g.connect(arMaster);
  src.start(t0);src.stop(t0+dur+0.02);
}
function arSfx(name){
  const now=typeof performance!=="undefined"?performance.now():0;
  if(name==="shoot"){if(now-arLastShootSfx<80)return;arLastShootSfx=now;
    arTone(920,240,0.07,"square",0.10);arNoise(0.05,"highpass",2500,3000,0.05)}
  else if(name==="hit"){if(now-arLastHitSfx<45)return;arLastHitSfx=now;
    const v=0.9+Math.random()*0.25;
    arNoise(0.06,"bandpass",1700*v,900*v,0.30);arTone(260*v,110*v,0.07,"triangle",0.22)}
  else if(name==="die"){if(now-arLastDieSfx<60)return;arLastDieSfx=now;
    arTone(340,880,0.09,"sine",0.20);arTone(520,55,0.26,"sawtooth",0.20,0.02);arNoise(0.18,"lowpass",1600,200,0.22,0.01)}
  else if(name==="explode"){arNoise(0.42,"lowpass",900,60,0.5);arTone(130,28,0.4,"sine",0.42);arNoise(0.1,"highpass",3000,4000,0.12)}
  else if(name==="hurt"){arTone(210,55,0.2,"sawtooth",0.26);arNoise(0.12,"bandpass",500,240,0.2)}
  else if(name==="warn"){arTone(190,380,0.16,"square",0.12)}
  else if(name==="clear"){arTone(660,660,0.1,"sine",0.18);arTone(880,880,0.1,"sine",0.18,0.09);arTone(1320,1320,0.18,"sine",0.16,0.18)}
  else if(name==="over"){arTone(392,392,0.18,"triangle",0.2);arTone(311,311,0.18,"triangle",0.2,0.18);arTone(262,170,0.36,"triangle",0.2,0.36)}
  else if(name==="pick"){arTone(540,820,0.09,"sine",0.16);arTone(1080,1080,0.06,"sine",0.07,0.02)}
  else if(name==="levelup"){arTone(523,523,0.09,"square",0.13);arTone(659,659,0.09,"square",0.13,0.08);arTone(784,784,0.09,"square",0.13,0.16);arTone(1047,1047,0.2,"square",0.15,0.24);arNoise(0.3,"highpass",5000,7000,0.05,0.1)}
}
function arGemSfx(){

  s.gemCombo=(s.gemT>0?(s.gemCombo||0)+1:0);s.gemT=0.9;

let arState=null,arRAF=0,arKeys={};
function arBestStage(){try{return Number(localStorage.getItem("nougaen-is-archer-beststage")||0)}catch(_){return 0}}
function arNewGame(){

    p:{x:AR_W/2,y:AR_H-70,r:14,hp:100,maxhp:100,lv:1,xp:0,xpNeed:8,invuln:0,fireT:0,moving:false,aimA:-Math.PI/2,
       dmg:12,interval:0.55,multi:1,front:0,diag:false,bounce:0,pierce:0,moveMul:1,crit:0.05,arrowSpd:380,abilities:[]},

function arMakeObs(stage){

  const templates=[
    [{x:90,y:180,w:60,h:60},{x:270,y:180,w:60,h:60}],

const AR_ETYPES={
  chaser:{hp:26,r:13,spd:62,dmg:8},
  shooter:{hp:20,r:13,spd:48,dmg:10},
  bat:{hp:14,r:11,spd:118,dmg:6},
  dasher:{hp:36,r:14,spd:58,dmg:12},
  splitter:{hp:46,r:17,spd:44,dmg:8},
  mini:{hp:9,r:8,spd:98,dmg:5},
  turret:{hp:30,r:14,spd:0,dmg:10},
  ghost:{hp:22,r:13,spd:56,dmg:9},
  bomber:{hp:18,r:12,spd:90,dmg:0},
  boss:{hp:340,r:30,spd:34,dmg:15},
  necro:{hp:520,r:28,spd:40,dmg:12}
};
function arSpawn(type,x,y,hpMul){
  const b=AR_ETYPES[type];
  return {type,x,y,r:b.r,hp:Math.round(b.hp*(hpMul||1)),maxhp:Math.round(b.hp*(hpMul||1)),spd:b.spd,dmg:b.dmg,
    t:Math.random()*2,fireT:1.2+Math.random()*1.4,wob:Math.random()*6.28,state:"chase",stateT:0,dirX:0,dirY:0,fuse:-1,flash:0,summonT:3};
}
function arMakeEnemies(stage){
  const hpMul=1+(stage-1)*0.35;
  const list=[];
  if(stage%5===0){
    const kind=(stage/5)%2===1?"boss":"necro";
    list.push(arSpawn(kind,AR_W/2,115,hpMul));
    const n=Math.min(2+Math.floor(stage/5),4);
    for(let i=0;i<n;i++)list.push(arSpawn("chaser",70+i*90,200,hpMul));
    return list;
  }
  const pool=[["chaser",10]];
  if(stage>=2)pool.push(["shooter",4]);
  if(stage>=3)pool.push(["bat",4],["dasher",3]);
  if(stage>=4)pool.push(["splitter",3],["turret",2]);
  if(stage>=6)pool.push(["ghost",3],["bomber",3]);
  const totalW=pool.reduce((a,p)=>a+p[1],0);
  const n=Math.min(3+stage,11);
  let turrets=0;
  for(let i=0;i<n;i++){
    let roll=Math.random()*totalW,type="chaser";
    for(const [tp,w] of pool){if(roll<w){type=tp;break}roll-=w}
    if(type==="turret"){if(turrets>=2)type="chaser";else turrets++}
    const x=type==="turret"?(60+Math.random()*(AR_W-120)):(50+Math.random()*(AR_W-100));
    const y=type==="turret"?(90+Math.random()*180):(70+Math.random()*260);
    list.push(arSpawn(type,x,y,hpMul));
  }
  return list;
}
function arApplyAbility(id){
  const p=arState.p;
  switch(id){
    case "atk":p.dmg*=1.25;break;
    case "spd":p.interval*=0.82;break;
    case "multi":p.multi++;break;
    case "front":p.front++;break;
    case "diag":p.diag=true;break;
    case "bounce":p.bounce++;break;
    case "pierce":p.pierce++;break;
    case "move":p.moveMul*=1.12;break;
    case "hp":p.maxhp+=25;p.hp=Math.min(p.maxhp,p.hp+25);break;
    case "crit":p.crit+=0.15;break;
    case "arrowspd":p.arrowSpd*=1.25;p.dmg*=1.1;break;
    case "heal":p.hp=Math.min(p.maxhp,p.hp+p.maxhp*0.4);break;
  }
  p.abilities.push(id);
}
function arLevelUp(){
  const s=arState;s.phase="choose";arSfx("levelup");
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2;s.parts.push({x:s.p.x,y:s.p.y,vx:Math.cos(a)*130,vy:Math.sin(a)*130,life:0.5,max:0.5,color:"#ffd94d",size:3})}
  const pool=AR_ABILITIES.map(a=>a.id).filter(id=>id!=="diag"||!s.p.diag);
  const offers=[];
  while(offers.length<3&&pool.length){
    const i=(Math.random()*pool.length)|0;
    offers.push(pool.splice(i,1)[0]);
  }
  s.offers=offers;
  arShowOverlay(arChooseOverlayHtml());
}
function arCircleRect(cx,cy,r,rc){
  const nx=Math.max(rc.x,Math.min(cx,rc.x+rc.w)),ny=Math.max(rc.y,Math.min(cy,rc.y+rc.h));
  return (cx-nx)*(cx-nx)+(cy-ny)*(cy-ny)<r*r;
}
function arMoveCircle(e,dx,dy,passObs){
  e.x+=dx;e.y+=dy;
  if(!passObs)for(const o of arState.obs){
    if(arCircleRect(e.x,e.y,e.r,o)){
      const nx=Math.max(o.x,Math.min(e.x,o.x+o.w)),ny=Math.max(o.y,Math.min(e.y,o.y+o.h));
      const vx=e.x-nx,vy=e.y-ny;const d=Math.hypot(vx,vy);
      if(d<0.001){
        const lf=e.x-o.x,rt=o.x+o.w-e.x,tp=e.y-o.y,bt=o.y+o.h-e.y;
        const m=Math.min(lf,rt,tp,bt);
        if(m===lf)e.x=o.x-e.r-0.5;else if(m===rt)e.x=o.x+o.w+e.r+0.5;
        else if(m===tp)e.y=o.y-e.r-0.5;else e.y=o.y+o.h+e.r+0.5;
        continue;
      }
      e.x=nx+vx/d*e.r;e.y=ny+vy/d*e.r;
    }
  }
  e.x=Math.max(e.r+8,Math.min(AR_W-e.r-8,e.x));
  e.y=Math.max(e.r+8,Math.min(AR_H-e.r-8,e.y));
}
function arBurst(x,y,n,color,spd,size){

    const a=Math.random()*Math.PI*2,v=(0.3+Math.random()*0.7)*(spd||120);
    s.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0.35+Math.random()*0.3,max:0.6,color,size:size||3});
  }
}
function arHurtPlayer(dmg){
  const s=arState,p=s.p;
  if(p.invuln>0||s.phase!=="play")return;
  p.hp-=dmg;p.invuln=0.6;arSfx("hurt");

function arExplode(e){
  const s=arState,p=s.p;
  e.dead=true;e.hp=0;
  arSfx("explode");
  arBurst(e.x,e.y,26,"#ff9f2e",220,4);arBurst(e.x,e.y,12,"#ffe08a",140,3);
  s.texts.push({x:e.x,y:e.y-30,vy:-30,life:0.5,text:"BOOM",color:"#ffb02e",size:16});
  if(Math.hypot(p.x-e.x,p.y-e.y)<78+p.r)arHurtPlayer(18);
  for(const o of s.enemies){if(o!==e&&!o.dead&&Math.hypot(o.x-e.x,o.y-e.y)<78+o.r){o.hp-=26;o.flash=0.12}}
}
function arTick(dt){
  const s=arState,p=s.p;
  s.time+=dt;
  if(s.gemT>0)s.gemT-=dt;
  if(p.invuln>0)p.invuln-=dt;
  // --- move input ---
  let mx=0,my=0,moving=false;
  if(s.joy.active){
    const dx=s.joy.cx-s.joy.ox,dy=s.joy.cy-s.joy.oy;const mag=Math.hypot(dx,dy);
    if(mag>12){mx=dx/mag;my=dy/mag;moving=true}
  }else{
    if(arKeys["arrowleft"]||arKeys["a"])mx-=1;
    if(arKeys["arrowright"]||arKeys["d"])mx+=1;
    if(arKeys["arrowup"]||arKeys["w"])my-=1;
    if(arKeys["arrowdown"]||arKeys["s"])my+=1;
    if(mx||my){const m=Math.hypot(mx,my);mx/=m;my/=m;moving=true}
  }
  p.moving=moving;
  if(moving){
    arMoveCircle(p,mx*175*p.moveMul*dt,my*175*p.moveMul*dt);
    p.aimA=Math.atan2(my,mx);
    p.fireT=Math.min(p.fireT,0.12);
  }else if(s.enemies.length){
    let tgt=null,bd=1e18;
    for(const e of s.enemies){const d=(e.x-p.x)**2+(e.y-p.y)**2;if(d<bd){bd=d;tgt=e}}
    if(tgt)p.aimA=Math.atan2(tgt.y-p.y,tgt.x-p.x);
    p.fireT-=dt;
    if(p.fireT<=0&&tgt){p.fireT=p.interval;arFireVolley(tgt)}
  }
  // --- enemies ---
  for(const e of s.enemies){
    if(e.dead)continue;
    e.t+=dt;e.flash=Math.max(0,(e.flash||0)-dt);
    const dx=p.x-e.x,dy=p.y-e.y;const dist=Math.hypot(dx,dy)||1;
    const ux=dx/dist,uy=dy/dist;
    switch(e.type){
      case "shooter":
        if(dist>215)arMoveCircle(e,ux*e.spd*dt,uy*e.spd*dt);
        e.fireT-=dt;
        if(e.fireT<=0&&dist<340){e.fireT=2.2;s.bullets.push({x:e.x,y:e.y,vx:ux*158,vy:uy*158,r:5,dmg:e.dmg})}
        break;
      case "turret":
        e.fireT-=dt;
        if(e.fireT<=0&&dist<360){e.fireT=2.6;const base=Math.atan2(dy,dx);
          for(const off of [-0.3,0,0.3])s.bullets.push({x:e.x,y:e.y-6,vx:Math.cos(base+off)*140,vy:Math.sin(base+off)*140,r:5,dmg:e.dmg})}
        break;
      case "bat":{
        const wob=Math.sin(s.time*5+e.wob)*0.7;
        arMoveCircle(e,(ux*Math.cos(wob)-uy*Math.sin(wob))*e.spd*dt,(uy*Math.cos(wob)+ux*Math.sin(wob))*e.spd*dt);
        break}
      case "dasher":
        e.stateT-=dt;
        if(e.state==="chase"){
          arMoveCircle(e,ux*e.spd*dt,uy*e.spd*dt);
          if(dist<175){e.state="windup";e.stateT=0.55;arSfx("warn")}
        }else if(e.state==="windup"){
          if(e.stateT<=0){e.state="charge";e.stateT=0.5;e.dirX=ux;e.dirY=uy}
        }else if(e.state==="charge"){
          arMoveCircle(e,e.dirX*335*dt,e.dirY*335*dt);
          if(e.stateT<=0){e.state="rest";e.stateT=0.8}
        }else if(e.stateT<=0)e.state="chase";
        break;
      case "bomber":
        if(e.fuse>=0){
          e.fuse-=dt;
          if(e.fuse<=0){arExplode(e)}
        }else{
          arMoveCircle(e,ux*e.spd*dt,uy*e.spd*dt);
          if(dist<48)e.fuse=0.5;
        }
        break;
      case "ghost":
        arMoveCircle(e,ux*e.spd*dt,uy*e.spd*dt,true);
        break;
      case "boss":
        arMoveCircle(e,ux*e.spd*dt,uy*e.spd*dt);
        e.fireT-=dt;
        if(e.fireT<=0){e.fireT=3;for(let i=0;i<10;i++){const a=i/10*Math.PI*2+e.t;s.bullets.push({x:e.x,y:e.y,vx:Math.cos(a)*122,vy:Math.sin(a)*122,r:5,dmg:10})}}
        break;
      case "necro":
        if(dist>170)arMoveCircle(e,ux*e.spd*dt,uy*e.spd*dt);
        e.fireT-=dt;
        if(e.fireT<=0&&dist<360){e.fireT=2;const base=Math.atan2(dy,dx);
          for(const off of [-0.22,0,0.22])s.bullets.push({x:e.x,y:e.y,vx:Math.cos(base+off)*165,vy:Math.sin(base+off)*165,r:5,dmg:e.dmg})}
        e.summonT-=dt;
        if(e.summonT<=0&&s.enemies.length<9){e.summonT=6;
          s.enemies.push(arSpawn("mini",e.x-34,e.y+10,1),arSpawn("mini",e.x+34,e.y+10,1));
          arBurst(e.x,e.y,10,"#9a6ae0",90,3)}
        break;
      default: // chaser, splitter, mini
        arMoveCircle(e,ux*e.spd*dt,uy*e.spd*dt);
    }
    if(!e.dead&&e.type!=="bomber"&&dist<e.r+p.r)arHurtPlayer(e.dmg);
    if(s.phase!=="play")return;
  }
  // separation
  for(let i=0;i<s.enemies.length;i++)for(let j=i+1;j<s.enemies.length;j++){
    const a=s.enemies[i],b=s.enemies[j];
    if(a.type==="turret"||b.type==="turret")continue;
    const dx=b.x-a.x,dy=b.y-a.y;const d=Math.hypot(dx,dy),min=a.r+b.r+2;
    if(d>0&&d<min){const push=(min-d)/2;b.x+=dx/d*push;b.y+=dy/d*push;a.x-=dx/d*push;a.y-=dy/d*push}
  }
  // --- arrows ---
  for(const a of s.arrows){
    a.x+=a.vx*dt;a.y+=a.vy*dt;
    if(a.x<10||a.x>AR_W-10||a.y<10||a.y>AR_H-10){
      if(a.bounce>0){
        a.bounce--;
        if(a.x<10||a.x>AR_W-10)a.vx*=-1;
        if(a.y<10||a.y>AR_H-10)a.vy*=-1;
        a.x=Math.max(11,Math.min(AR_W-11,a.x));a.y=Math.max(11,Math.min(AR_H-11,a.y));
      }else a.dead=true;
    }
    if(!a.dead)for(const o of s.obs){if(a.x>o.x&&a.x<o.x+o.w&&a.y>o.y&&a.y<o.y+o.h){a.dead=true;break}}
    if(!a.dead)for(const e of s.enemies){
      if(e.dead||a.hitSet.has(e))continue;
      if(Math.hypot(e.x-a.x,e.y-a.y)<e.r+4){
        a.hitSet.add(e);
        const crit=Math.random()<p.crit;
        const dmg=Math.round(crit?a.dmg*2:a.dmg);
        e.hp-=dmg;e.flash=0.12;
        arSfx("hit");
        arBurst(a.x,a.y,3,crit?"#ffd94d":"#ffffff",90,2);
        s.texts.push({x:e.x+(Math.random()*16-8),y:e.y-e.r-8,vy:-52,life:0.55,text:String(dmg),color:crit?"#ffd94d":"#ffffff",size:crit?17:12});
        if(a.pierce>0)a.pierce--;else a.dead=true;
        break;
      }
    }
  }
  s.arrows=s.arrows.filter(a=>!a.dead);
  // --- enemy bullets ---
  for(const b of s.bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x<6||b.x>AR_W-6||b.y<6||b.y>AR_H-6)b.dead=true;
    if(!b.dead&&Math.hypot(p.x-b.x,p.y-b.y)<p.r+b.r){b.dead=true;arHurtPlayer(b.dmg);if(s.phase!=="play")return}
  }
  s.bullets=s.bullets.filter(b=>!b.dead);
  // --- deaths ---
  const before=s.enemies.filter(e=>!e.dead).length;
  const spawns=[];
  s.enemies=s.enemies.filter(e=>{
    if(e.hp>0&&!e.dead)return true;
    s.kills++;
    if(e.type==="bomber"&&!e.dead)arExplode(e);
    else arSfx("die");
    const colors={chaser:"#57c84c",shooter:"#e8e4da",bat:"#5a6c8f",dasher:"#b5763a",splitter:"#3fae8a",mini:"#57c84c",turret:"#e06a9a",ghost:"#cfd8ea",bomber:"#ff9f2e",boss:"#e0483e",necro:"#9a6ae0"};
    arBurst(e.x,e.y,e.r>20?18:10,colors[e.type]||"#fff",150,3);
    if(e.type==="splitter"){spawns.push(arSpawn("mini",e.x-14,e.y,1),arSpawn("mini",e.x+14,e.y,1))}
    const gn=(e.type==="boss"||e.type==="necro")?12:(e.type==="bat"||e.type==="mini"?3:4);
    for(let i=0;i<gn;i++){
      const ga=Math.random()*Math.PI*2,gsp=60+Math.random()*130;
      s.gems.push({x:e.x,y:e.y,v:(e.type==="boss"||e.type==="necro")?2:1,vx:Math.cos(ga)*gsp,vy:Math.sin(ga)*gsp});
    }
    return false;
  });
  for(const m of spawns)s.enemies.push(m);
  if(before&&!s.enemies.length){s.doorOpen=true;arSfx("clear")}
  // --- gems ---
  for(const g of s.gems){
    if(g.vx||g.vy){g.x+=g.vx*dt;g.y+=g.vy*dt;g.vx*=Math.max(0,1-4.5*dt);g.vy*=Math.max(0,1-4.5*dt);if(Math.abs(g.vx)<5)g.vx=0;if(Math.abs(g.vy)<5)g.vy=0}
    const d=Math.hypot(p.x-g.x,p.y-g.y);
    if(d<95){g.x+=(p.x-g.x)*dt*7;g.y+=(p.y-g.y)*dt*7}
    if(d<p.r+9){
      g.dead=true;p.xp+=g.v;arGemSfx();
      if(p.xp>=p.xpNeed){p.xp-=p.xpNeed;p.lv++;p.xpNeed=8+p.lv*3;arLevelUp();return}
    }
  }
  s.gems=s.gems.filter(g=>!g.dead);
  // --- particles & texts ---
  for(const pt of s.parts){pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;pt.vx*=Math.max(0,1-3*dt);pt.vy*=Math.max(0,1-3*dt);pt.life-=dt}
  s.parts=s.parts.filter(pt=>pt.life>0);
  for(const tx of s.texts){tx.y+=tx.vy*dt;tx.life-=dt}
  s.texts=s.texts.filter(tx=>tx.life>0);
  // --- door ---
  if(s.doorOpen&&p.x>AR_W/2-35&&p.x<AR_W/2+35&&p.y<40)arNextStage();
  arHud();
}
function arFireVolley(tgt){
  const s=arState,p=s.p;
  arSfx("shoot");
  const base=Math.atan2(tgt.y-p.y,tgt.x-p.x);
  const shots=[];
  for(let i=0;i<p.multi;i++)shots.push(base+(i-(p.multi-1)/2)*0.13);
  if(p.diag){shots.push(base-0.42,base+0.42)}
  for(const ang of shots){
    for(let f=0;f<=p.front;f++){
      const off=(f-p.front/2)*16;
      const ox=p.x+Math.cos(ang+Math.PI/2)*off,oy=p.y+Math.sin(ang+Math.PI/2)*off;
      s.arrows.push({x:ox,y:oy,vx:Math.cos(ang)*p.arrowSpd,vy:Math.sin(ang)*p.arrowSpd,dmg:p.dmg,pierce:p.pierce,bounce:p.bounce,hitSet:new Set(),dead:false});
    }
  }
}
function arChooseOverlayHtml(){
  const s=arState;
  const cards=s.offers.map(id=>{
    const a=AR_ABILITIES.find(x=>x.id===id);const tx=a[lang==="ja"?"ja":"en"];
    return `<button type="button" class="ar-card" data-ar-ab="${id}"><b>${esc(tx[0])}</b><span>${esc(tx[1])}</span></button>`;
  }).join("");
  return `<div class="ar-overlay"><div class="ar-choose-title">${esc(t("arChoose"))}</div><div class="ar-cards">${cards}</div></div>`;
}
function arOverOverlayHtml(){
  const s=arState,p=s.p;
  return `<div class="ar-overlay"><div class="ar-over">${esc(t("arGameOver"))}</div><div class="rh-rline">${esc(t("arReach"))}: <b>${s.stage}</b> / ${esc(t("arBestStage"))}: <b>${s.best}</b></div><div class="rh-rline">Lv ${p.lv} ・ ${s.kills} ${esc(t("arKills"))}</div><button type="button" class="primary-link external-game-play" data-ar-start>${esc(t("arAgain"))}</button></div>`;
}
function arChipsHtml(){
  if(!arState)return "";
  return arState.p.abilities.map(id=>{const a=AR_ABILITIES.find(x=>x.id===id);return `<span class="ar-chip">${esc(a?a[lang==="ja"?"ja":"en"][0]:id)}</span>`}).join("");
}
function arShowOverlay(htmlStr){
  const wrap=document.querySelector(".ar-wrap");
  if(wrap){const old=wrap.querySelector(".ar-overlay");if(old)old.remove();wrap.insertAdjacentHTML("beforeend",htmlStr)}
  else render();
}
function arGameOver(){
  const s=arState;s.phase="over";arSfx("over");
  if(s.stage>s.best){s.best=s.stage;try{localStorage.setItem("nougaen-is-archer-beststage",String(s.best))}catch(_){ }}
  arShowOverlay(arOverOverlayHtml());
}
function arHud(){
  const s=arState;if(!s)return;
  const hp=document.getElementById("arHpBar"),ht=document.getElementById("arHpText"),xp=document.getElementById("arXpBar");
  if(hp)hp.style.width=Math.max(0,s.p.hp/s.p.maxhp*100)+"%";
  if(ht)ht.textContent=Math.max(0,Math.ceil(s.p.hp))+"/"+s.p.maxhp;
  if(xp)xp.style.width=Math.min(100,s.p.xp/s.p.xpNeed*100)+"%";
}
function renderArcher(){
  const head=`<p class="eyebrow">${esc(t("games"))}</p><h1 class="page-title">${esc(t("archer"))}</h1>`;
  if(!arState||arState.phase==="intro"){
    return `${head}<p class="page-subtitle">${esc(t("arIntro"))}</p><button type="button" class="primary-link external-game-play" data-ar-start>${esc(t("arStart"))}</button><p class="footnote">${esc(t("arHow"))}</p>`;
  }
  const s=arState,p=s.p;
  const chips=arChipsHtml();
  let overlay="";
  if(s.phase==="choose")overlay=arChooseOverlayHtml();
  if(s.phase==="over")overlay=arOverOverlayHtml();
  setTimeout(()=>{arDraw();arHud()},0);
  return `<div class="ar-stage"><div class="mj-bar"><span>${esc(t("arStage"))} <b>${s.stage}</b></span><span>Lv <b>${p.lv}</b></span><span>${esc(t("arKills"))} <b>${s.kills}</b></span></div><div class="ar-hud"><div class="ar-bar ar-hpbar"><i id="arHpBar"></i></div><span id="arHpText"></span></div><div class="ar-hud"><div class="ar-bar ar-xpbar"><i id="arXpBar"></i></div><span>XP</span></div><div class="ar-chips" id="arChips">${chips}</div><div class="ar-wrap"><canvas id="arCanvas" width="${AR_W}" height="${AR_H}" class="ar-canvas2"></canvas><button type="button" class="ar-fs" data-ar-fs title="${esc(t("arFs"))}">⛶</button>${overlay}</div></div>`;
}
// ----- drawing -----
function arShadow(g,x,y,r){
  g.fillStyle="rgba(0,0,0,.28)";
  g.beginPath();g.ellipse(x,y+r*0.82,r*0.85,r*0.3,0,0,Math.PI*2);g.fill();
}
function arDrawPlayer(g,s){
  const p=s.p;
  const bob=p.moving?Math.sin(s.time*13)*1.6:Math.sin(s.time*2.4)*0.8;
  const x=p.x,y=p.y+bob;
  arShadow(g,p.x,p.y,p.r);
  const blink=p.invuln>0&&Math.floor(s.time*14)%2===0;
  g.globalAlpha=blink?0.35:1;
  // cloak
  g.fillStyle="#2e7d4f";
  g.beginPath();
  g.moveTo(x,y-13);
  g.quadraticCurveTo(x+13,y-2,x+10,y+14);
  g.quadraticCurveTo(x,y+18,x-10,y+14);
  g.quadraticCurveTo(x-13,y-2,x,y-13);
  g.fill();
  g.fillStyle="#256b42";g.fillRect(x-10,y+9,20,4);
  // head + hood
  g.fillStyle="#3f9e63";
  g.beginPath();g.arc(x,y-10,9.5,0,Math.PI*2);g.fill();
  g.fillStyle="#f2c894";
  g.beginPath();g.arc(x,y-8.5,6.4,0,Math.PI*2);g.fill();
  g.fillStyle="#20242c";
  const fx=Math.cos(p.aimA),fy=Math.sin(p.aimA);
  g.beginPath();g.arc(x+fx*2.4-2.6,y-8.5+fy*1.6,1.25,0,Math.PI*2);g.arc(x+fx*2.4+2.6,y-8.5+fy*1.6,1.25,0,Math.PI*2);g.fill();
  // bow aimed
  g.save();
  g.translate(x+fx*11,y-4+fy*11);
  g.rotate(p.aimA);
  g.strokeStyle="#a9742f";g.lineWidth=3;
  g.beginPath();g.arc(0,0,12,-1.15,1.15);g.stroke();
  g.strokeStyle="rgba(240,240,240,.85)";g.lineWidth=1;
  const bx=Math.cos(1.15)*12,by=Math.sin(1.15)*12;
  g.beginPath();g.moveTo(bx,-by);g.lineTo(2,0);g.lineTo(bx,by);g.stroke();
  g.restore();
  g.globalAlpha=1;
}
function arDrawEnemy(g,s,e){
  const flash=e.flash>0;
  const x=e.x,y=e.y;
  if(e.type!=="bat"&&e.type!=="ghost")arShadow(g,x,y,e.r);
  g.save();
  if(e.type==="ghost")g.globalAlpha=0.55+0.15*Math.sin(s.time*3+e.wob);
  if(e.type==="dasher"&&e.state==="windup"){g.translate((Math.random()*3-1.5),0)}
  switch(e.type){
    case "chaser": case "splitter": case "mini": {
      const sq=1+Math.sin(s.time*6+e.wob)*0.07;
      g.fillStyle=flash?"#ffffff":(e.type==="splitter"?"#3fae8a":"#57c84c");
      g.beginPath();g.ellipse(x,y,e.r*sq,e.r*(2-sq)*0.96+ e.r*0.1,0,0,Math.PI*2);g.fill();
      g.fillStyle="rgba(255,255,255,.35)";
      g.beginPath();g.ellipse(x-e.r*0.35,y-e.r*0.4,e.r*0.28,e.r*0.16,-0.6,0,Math.PI*2);g.fill();
      g.fillStyle="#12300f";
      g.beginPath();g.arc(x-4,y-2,2.3,0,Math.PI*2);g.arc(x+4,y-2,2.3,0,Math.PI*2);g.fill();
      g.strokeStyle="#12300f";g.lineWidth=1.6;
      g.beginPath();g.arc(x,y+3,4,0.15*Math.PI,0.85*Math.PI);g.stroke();
      break}
    case "shooter": case "necro": {
      const necro=e.type==="necro";
      g.fillStyle=flash?"#ffffff":(necro?"#4a3566":"#5d6a52");
      g.beginPath();
      g.moveTo(x,y-4);g.lineTo(x+e.r*0.95,y+14);g.lineTo(x-e.r*0.95,y+14);g.closePath();g.fill();
      g.fillStyle=flash?"#ffffff":"#ece7db";
      g.beginPath();g.arc(x,y-8,necro?11:9.5,0,Math.PI*2);g.fill();
      g.fillStyle="#14161c";
      g.beginPath();g.arc(x-3.6,y-8,2.5,0,Math.PI*2);g.arc(x+3.6,y-8,2.5,0,Math.PI*2);g.fill();
      g.beginPath();g.moveTo(x,y-3.4);g.lineTo(x-1.8,y-0.6);g.lineTo(x+1.8,y-0.6);g.closePath();g.fill();
      g.fillRect(x-3.4,y-0.4,1.8,2.8);g.fillRect(x+1.6,y-0.4,1.8,2.8);
      if(necro){
        g.strokeStyle="#c9a227";g.lineWidth=2.6;
        g.beginPath();g.moveTo(x+13,y+12);g.lineTo(x+16,y-16);g.stroke();
        g.fillStyle="#b678f0";g.beginPath();g.arc(x+16,y-19,4.4,0,Math.PI*2);g.fill();
      }else{
        g.strokeStyle="#a9742f";g.lineWidth=2.4;
        g.beginPath();g.arc(x+11,y+1,9,-1.15,1.15);g.stroke();
      }
      break}
    case "bat": {
      const flap=Math.sin(s.time*16+e.wob)*0.55;
      g.fillStyle=flash?"#ffffff":"#46587a";
      for(const sgn of [-1,1]){
        g.save();g.translate(x+sgn*6,y-2);g.rotate(sgn*flap*0.7);
        g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(sgn*15,-9,sgn*20,1);g.quadraticCurveTo(sgn*11,4,sgn*7,8);g.quadraticCurveTo(sgn*3,3,0,4);g.closePath();g.fill();
        g.restore();
      }
      g.fillStyle=flash?"#ffffff":"#5d74a0";
      g.beginPath();g.ellipse(x,y,9,8,0,0,Math.PI*2);g.fill();
      g.fillStyle="#ffd94d";
      g.beginPath();g.arc(x-3,y-1.5,1.7,0,Math.PI*2);g.arc(x+3,y-1.5,1.7,0,Math.PI*2);g.fill();
      g.fillStyle="#ece7db";
      g.beginPath();g.moveTo(x-2.6,y+3);g.lineTo(x-1.2,y+5.4);g.lineTo(x+0.2,y+3);g.closePath();g.fill();
      break}
    case "dasher": {
      g.fillStyle=flash?"#ffffff":"#a06a35";
      g.beginPath();g.ellipse(x,y,16,12.5,0,0,Math.PI*2);g.fill();
      g.fillStyle=flash?"#ffffff":"#b5763a";
      g.beginPath();g.arc(x,y-3,10,0,Math.PI*2);g.fill();
      g.fillStyle="#e8a0b4";
      g.beginPath();g.ellipse(x,y+1.5,5.4,4.2,0,0,Math.PI*2);g.fill();
      g.fillStyle="#8a4f56";
      g.beginPath();g.arc(x-2,y+1.5,1.1,0,Math.PI*2);g.arc(x+2,y+1.5,1.1,0,Math.PI*2);g.fill();
      g.fillStyle="#f4ecd8";
      for(const sgn of [-1,1]){g.beginPath();g.moveTo(x+sgn*8.4,y+2);g.lineTo(x+sgn*12.4,y-2.6);g.lineTo(x+sgn*6.4,y-1.4);g.closePath();g.fill()}
      g.fillStyle="#241a10";
      g.beginPath();g.arc(x-4.6,y-6.4,1.8,0,Math.PI*2);g.arc(x+4.6,y-6.4,1.8,0,Math.PI*2);g.fill();
      if(e.state==="windup"){
        g.fillStyle="#ff5347";g.font="bold 17px sans-serif";g.textAlign="center";
        g.fillText("!",x,y-24);
      }
      break}
    case "turret": {
      g.fillStyle="#6d4c2f";
      g.beginPath();g.moveTo(x-11,y+13);g.lineTo(x+11,y+13);g.lineTo(x+7,y+3);g.lineTo(x-7,y+3);g.closePath();g.fill();
      g.strokeStyle="#3f9e63";g.lineWidth=4;
      g.beginPath();g.moveTo(x,y+4);g.quadraticCurveTo(x+3,y-4,x,y-8);g.stroke();
      g.fillStyle=flash?"#ffffff":"#e06a9a";
      for(let i=0;i<6;i++){
        const a=i/6*Math.PI*2+s.time*0.7;
        g.beginPath();g.ellipse(x+Math.cos(a)*8.6,y-11+Math.sin(a)*8.6,5,3.2,a,0,Math.PI*2);g.fill();

function arDraw(){
  const cv=document.getElementById("arCanvas");if(!cv||!arState)return;

  const grad=g.createLinearGradient(0,0,0,AR_H);

  for(let ty=0;ty<10;ty++)for(let tx=0;tx<7;tx++){if((tx+ty)%2===0)g.fillRect(tx*60,ty*60,60,60)}
  g.strokeStyle="#41597c";g.lineWidth=6;g.strokeRect(3,3,AR_W-6,AR_H-6);
  // door
  g.fillStyle=s.doorOpen?"#f5c542":"#31435f";
