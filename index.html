<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111522">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="">
  <link rel="icon" type="image/png" sizes="512x512" data-brand-icon href="">
  <link rel="apple-touch-icon" sizes="512x512" data-brand-icon href="">
  <meta name="color-scheme" content="dark light">
  <title></title>
  <style>
    :root{color-scheme:dark;--bg:#0d111b;--panel:#151b2a;--panel-2:#1b2335;--ink:#f1f0eb;--muted:#a4a9b6;--line:#30384b;--gold:#dfc98e;--gold-dim:#a89158;--indigo:#262e4c;--shadow:0 24px 80px #0008;--radius:24px;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    :root[data-theme="light"]{color-scheme:light;--bg:#e7e8ed;--panel:#f7f7f5;--panel-2:#ebedf2;--ink:#171b26;--muted:#646b79;--line:#cdd1da;--gold:#9b7930;--gold-dim:#b39b62;--indigo:#dce1ef;--shadow:0 24px 80px #25294228}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{min-height:100vh;background:radial-gradient(ellipse at 50% 4%,#34395888 0,transparent 44%),var(--bg);color:var(--ink);display:grid;place-items:center;padding:24px 12px}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}a{color:inherit}
    .phone{width:min(100%,430px);height:min(900px,calc(100dvh - 48px));min-height:640px;display:flex;flex-direction:column;overflow:hidden;position:relative;border:1px solid #777b8b44;border-radius:38px;background:linear-gradient(160deg,#1b2033 0%,var(--bg) 30%,var(--bg) 100%);box-shadow:var(--shadow);isolation:isolate}
    :root[data-theme="light"] .phone{background:linear-gradient(160deg,#e0e4ef 0%,var(--bg) 35%)}
    .phone:before,.phone:after{content:"";position:absolute;z-index:-1;pointer-events:none;filter:blur(1px)}.phone:before{width:260px;height:310px;top:90px;right:-180px;background:radial-gradient(ellipse,#6c6b9d24,transparent 68%);transform:rotate(-28deg)}.phone:after{width:190px;height:250px;bottom:90px;left:-130px;background:radial-gradient(ellipse,#d7c78a16,transparent 70%)}
    .topbar{padding:calc(16px + env(safe-area-inset-top)) 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid color-mix(in srgb,var(--line),transparent 35%);flex:none}.brand{display:flex;align-items:center;gap:11px;min-width:0;text-decoration:none}.mark{width:34px;height:34px;display:grid;place-items:center;flex:none;overflow:hidden;border-radius:10px}.mark img{display:block;width:100%;height:100%;object-fit:cover}.brandname{font-size:13px;letter-spacing:.12em;font-weight:750;white-space:nowrap}.languages{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:999px;background:color-mix(in srgb,var(--panel),transparent 10%)}.lang{width:34px;height:32px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:12px}.lang[aria-pressed="true"]{background:var(--gold);color:#252318;font-weight:750}
    #app{flex:1;overflow:auto;overscroll-behavior:contain;padding:22px 20px 24px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;animation:appear .2s ease-out}.bottomnav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid color-mix(in srgb,var(--line),transparent 35%);background:color-mix(in srgb,var(--bg),transparent 5%)}.navlink{min-height:46px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border-radius:16px;color:var(--muted);font-size:13px;transition:background .18s,color .18s}.navlink .navicon{font-size:16px}.navlink[aria-current="page"]{background:var(--panel-2);color:var(--gold);font-weight:700}
    @keyframes appear{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    .eyebrow{color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 8px}.page-title{font-size:27px;line-height:1.15;letter-spacing:-.035em;margin:0 0 8px}.page-subtitle{color:var(--muted);font-size:14px;line-height:1.65;margin:0}.section-head{display:flex;align-items:end;justify-content:space-between;gap:10px;margin:24px 0 12px}.section-head h2{font-size:15px;letter-spacing:.03em;margin:0}.small-link{color:var(--gold);font-size:12px;text-decoration:none;white-space:nowrap}.hero{margin-top:12px;padding:24px 20px 20px;border:1px solid #8d835355;border-radius:var(--radius);background:linear-gradient(135deg,#222942,var(--panel) 60%,#171d2c);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-32px;top:-56px;width:150px;height:210px;border:1px solid #e2d5a126;transform:rotate(28deg);clip-path:polygon(50% 0,100% 100%,50% 79%,0 100%);background:linear-gradient(160deg,#d8c48a12,transparent)}:root[data-theme="light"] .hero{background:linear-gradient(135deg,#dfe3f1,var(--panel) 65%,#f5f1e5)}
    .clock-time{font-variant-numeric:tabular-nums;letter-spacing:-.065em;font-size:clamp(52px,16vw,76px);font-weight:300;line-height:1.05;margin:7px 0 9px;position:relative;z-index:1}.clock-date{font-size:13px;color:var(--muted);position:relative;z-index:1}.hero-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding-top:14px;border-top:1px solid #ffffff16;position:relative;z-index:1;color:var(--muted);font-size:11px;letter-spacing:.09em}.hero-foot strong{color:var(--gold);font-size:10px;letter-spacing:.14em;font-weight:650}
    .app-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.app-card{min-height:112px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,var(--panel-2),var(--panel) 75%);text-decoration:none;transition:transform .18s,border-color .18s,background .18s}.app-card:hover,.app-card:focus-visible{transform:translateY(-2px);border-color:var(--gold-dim);outline:none}.app-icon{width:38px;height:38px;display:grid;place-items:center;overflow:hidden;border-radius:14px;background:linear-gradient(145deg,#dbcb9822,#737da51c)}.app-icon img{display:block;width:100%;height:100%;object-fit:cover}.app-name{display:block;font-size:12px;font-weight:650;line-height:1.25}
    .quick-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{min-height:72px;padding:13px 14px;border:1px solid var(--line);border-radius:18px;background:var(--panel);text-decoration:none;display:flex;align-items:center;justify-content:space-between;font-size:13px}.quick span:last-child{color:var(--gold);font-size:18px}
    .list{display:grid;gap:10px;margin-top:22px}.list-item{min-height:72px;display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(135deg,var(--panel-2),var(--panel));text-decoration:none;transition:border-color .18s,transform .18s}.list-item:hover,.list-item:focus-visible{border-color:var(--gold-dim);transform:translateY(-1px);outline:none}.list-icon{width:42px;height:42px;flex:none;overflow:hidden;border-radius:15px;background:#dfc98e16;color:var(--gold);display:grid;place-items:center;font-size:21px}.list-icon img{display:block;width:100%;height:100%;object-fit:cover}.list-copy{flex:1;min-width:0}.list-title{font-size:14px;font-weight:650}.list-desc{font-size:11px;color:var(--muted);margin-top:4px}.chevron{color:var(--muted);font-size:20px}
    .panel{padding:18px;border:1px solid var(--line);border-radius:20px;background:var(--panel);margin-top:18px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0;padding-bottom:0}.setting-row:first-child{padding-top:0}.setting-label{font-size:14px;font-weight:600}.setting-hint{color:var(--muted);font-size:11px;line-height:1.5;margin-top:4px}.segmented{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:13px;background:var(--bg)}.segmented button{border:0;border-radius:10px;background:transparent;color:var(--muted);padding:8px 11px;font-size:11px}.segmented button[aria-pressed="true"]{background:var(--indigo);color:var(--gold);font-weight:700}.danger{min-height:46px;padding:0 15px;border:1px solid #aa6c6c77;border-radius:14px;background:#9d49491a;color:#e7aaaa;font-size:13px;font-weight:650}.empty-state{margin-top:26px;padding:28px 20px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(135deg,var(--panel-2),var(--panel));text-align:center}.empty-icon{font-size:34px;color:var(--gold);margin-bottom:14px}.empty-state h2{font-size:18px;margin:0 0 8px}.empty-state p{font-size:13px;line-height:1.7;color:var(--muted);margin:0}.primary-link{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;margin-top:18px;border:1px solid var(--gold-dim);border-radius:15px;background:linear-gradient(135deg,#dac788,#b6a369);color:#211f18;font-weight:750;font-size:13px;text-decoration:none}.clock-panel{margin-top:24px;padding:26px 18px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(155deg,var(--panel-2),var(--panel));text-align:center}.clock-panel .clock-time{font-size:clamp(58px,18vw,82px)}.backlink{display:inline-flex;align-items:center;gap:7px;margin:0 0 18px;color:var(--muted);font-size:12px;text-decoration:none}.backlink:hover{color:var(--gold)}.footnote{font-size:11px;color:var(--muted);line-height:1.6;margin-top:18px}
    @media(max-width:480px){body{padding:0;background:var(--bg)}.phone{width:100%;height:100dvh;min-height:560px;border:0;border-radius:0;box-shadow:none}.topbar{padding-top:calc(13px + env(safe-area-inset-top))}#app{padding-inline:18px}.bottomnav{padding-bottom:calc(10px + env(safe-area-inset-bottom))}}
    @media(max-height:710px) and (min-width:481px){.phone{min-height:0;height:calc(100dvh - 24px)}body{padding:12px}.hero{padding-top:16px;padding-bottom:14px}.app-card{min-height:96px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  </style>

    appTitle:"砮幻 IS", productBase:"砮幻 IS", home:"ホーム", apps:"アプリ", settings:"設定", greeting:"ようこそ", homeIntro:"静かな石のかたちに、ひとさじの幻を。", localTime:"ローカルタイム", dateFormat:"ja-JP", appGrid:"アプリ", seeAll:"すべて見る", quickAccess:"クイックアクセス", openSettings:"設定を開く", exploreApps:"アプリを探す", games:"ゲーム", gamesDesc:"小さな遊びの世界", translate:"翻訳", translateDesc:"ことばをつなぐ", dictionary:"辞書", dictionaryDesc:"ことばをひらく", ai:"AI", aiDesc:"外部AIサービスを開く", clock:"時計", clockDesc:"時刻と日付", chooseLanguage:"表示言語", theme:"テーマ", themeHint:"落ち着いた色合いを選べます", dark:"ダーク", light:"ライト", data:"データ", dataHint:"このアプリの設定を初期状態に戻します", resetData:"設定をリセット", resetConfirm:"言語とテーマの設定を初期状態に戻しますか？", resetDone:"設定を初期状態に戻しました。", gamesIntro:"遊びたいものを選んでください。", blackjack:"Kassy風ブラックジャック", mahjong:"麻雀", rhythm:"リズムゲーム", archer:"Archer-Legends風ゲーム", stubTitle:"ここはまだ準備中です", stubText:"この場所には、これから新しい体験が加わります。", comingSoon:"近日公開", translateComing:"翻訳機能は近日公開です。", dictionaryComing:"辞書機能は近日公開です。", aiIntro:"外部のAIサービスを新しいタブで開きます。", openAI:"AIサービスを開く", clockIntro:"いまの時刻と日付", back:"戻る", statusLine:"INTERACTIVE / INTERNET SYSTEM", notOS:"OSではありません。", screenReaderHome:"ホーム画面", selectApp:"アプリを選択", externalNote:"外部サイトへ移動します。", gameStub:"ゲームは準備中です。", mainNavigation:"メインナビゲーション", languageNav:"表示言語", gamesOpen:"ゲーム一覧を開く", themeDarkHint:"深い藍と石の色", themeLightHint:"やわらかな明るい色", resetTitle:"リセット", now:"現在時刻", dateToday:"今日の日付"
  },
  en: {
    appTitle:"NougÆn IS", productBase:"NougÆn IS", home:"Home", apps:"Apps", settings:"Settings", greeting:"Welcome", homeIntro:"A quiet stone shape, with a hint of mirage.", localTime:"LOCAL TIME", dateFormat:"en-US", appGrid:"Apps", seeAll:"See all", quickAccess:"Quick access", openSettings:"Open settings", exploreApps:"Explore apps", games:"Games", gamesDesc:"A small world of play", translate:"Translate", translateDesc:"Connect across words", dictionary:"Dictionary", dictionaryDesc:"Explore words", ai:"AI", aiDesc:"Open an external AI service", clock:"Clock", clockDesc:"Time and date", chooseLanguage:"Display language", theme:"Theme", themeHint:"Choose a calm color palette", dark:"Dark", light:"Light", data:"Data", dataHint:"Restore this app's settings to their defaults", resetData:"Reset settings", resetConfirm:"Reset the language and theme settings to their defaults?", resetDone:"Settings have been reset.", gamesIntro:"Choose something to play.", blackjack:"Kassy-style Blackjack", mahjong:"Mahjong", rhythm:"Rhythm game", archer:"Archer-Legends-style game", stubTitle:"This space is still taking shape", stubText:"A new experience will find its way here in a future update.", comingSoon:"Coming soon", translateComing:"Translation is coming soon.", dictionaryComing:"The dictionary is coming soon.", aiIntro:"Open an external AI service in a new tab.", openAI:"Open AI service", clockIntro:"The current time and date", back:"Back", statusLine:"INTERACTIVE / INTERNET SYSTEM", notOS:"Not an operating system.", screenReaderHome:"Home screen", selectApp:"Choose an app", externalNote:"This opens an external website.", gameStub:"This game is coming soon.", mainNavigation:"Main navigation", languageNav:"Display language", gamesOpen:"Open games list", themeDarkHint:"Deep indigo and stone", themeLightHint:"A softer, brighter palette", resetTitle:"Reset", now:"Current time", dateToday:"Today's date"
  },
  nu: {}
};
const LANG_KEY="nougaen-is-language", THEME_KEY="nougaen-is-theme";
const GAME_ITEMS=[
  {id:"blackjack",icon:"♠",nameKey:"blackjack"},
  {id:"mahjong",icon:"▧",nameKey:"mahjong"},
  {id:"rhythm",icon:"♫",nameKey:"rhythm"},
  {id:"archer",icon:"➶",nameKey:"archer"}
];
let lang="ja",theme="dark";
try{const saved=localStorage.getItem(LANG_KEY);if(saved&&["ja","en","nu"].includes(saved))lang=saved;const savedTheme=localStorage.getItem(THEME_KEY);if(savedTheme&&["dark","light"].includes(savedTheme))theme=savedTheme}catch(_){ }
const t=key=>STRINGS[lang]?.[key]??STRINGS.en[key]??key;
const locale=()=>lang==="ja"?"ja-JP":"en-US";
const iconMap={games:"✦",translate:"文",dictionary:"書",ai:"✧",clock:"◷"};
const APPS=[
  {id:"games",icon:iconMap.games,nameKey:"games",descKey:"gamesDesc",render:renderGames},
  {id:"translate",icon:iconMap.translate,nameKey:"translate",descKey:"translateDesc",render:renderTranslate},
  {id:"dictionary",icon:iconMap.dictionary,nameKey:"dictionary",descKey:"dictionaryDesc",render:renderDictionary},
  {id:"ai",icon:iconMap.ai,nameKey:"ai",descKey:"aiDesc",render:renderAI},
  {id:"clock",icon:iconMap.clock,nameKey:"clock",descKey:"clockDesc",render:renderClock}
];
const app=document.getElementById("app"),nav=document.getElementById("bottomNav");
function esc(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function appCard(item){return `<a class="app-card" href="#/app/${item.id}" aria-label="${esc(t(item.nameKey))}"><span class="app-icon" aria-hidden="true"><img class="site-icon" alt=""></span><span class="app-label"><span class="app-name">${esc(t(item.nameKey))}</span></span></a>`}
function listItem(item,href){return `<a class="list-item" href="${href}"><span class="list-icon" aria-hidden="true"><img class="site-icon" alt=""></span><span class="list-copy"><span class="list-title">${esc(t(item.nameKey))}</span><span class="list-desc">${esc(t(item.descKey||"gamesDesc"))}</span></span><span class="chevron" aria-hidden="true">›</span></a>`}
function applyBrandIcons(){document.querySelectorAll("img.brand-icon,img.site-icon").forEach(img=>{if(img.src!==BRAND_ICON_DATA)img.src=BRAND_ICON_DATA});document.querySelectorAll("link[data-brand-icon]").forEach(link=>link.href=BRAND_ICON_DATA)}
function renderHome(){return `<p class="eyebrow">${esc(t("greeting"))}</p><h1 class="page-title">${esc(t("productBase"))}</h1><p class="page-subtitle">${esc(t("homeIntro"))}</p><section class="hero" aria-label="${esc(t("localTime"))}"><p class="eyebrow">${esc(t("localTime"))}</p><div class="clock-time" data-clock>--:--</div><div class="clock-date" data-date>—</div><div class="hero-foot"><span>${esc(t("statusLine"))}</span><strong>砮幻</strong></div></section><div class="section-head"><h2>${esc(t("appGrid"))}</h2><a class="small-link" href="#/apps">${esc(t("seeAll"))}　›</a></div><div class="app-grid">${APPS.map(appCard).join("")}</div><div class="section-head"><h2>${esc(t("quickAccess"))}</h2></div><div class="quick-row"><a class="quick" href="#/apps"><span>${esc(t("exploreApps"))}</span><span aria-hidden="true">↗</span></a><a class="quick" href="#/settings"><span>${esc(t("openSettings"))}</span><span aria-hidden="true">⚙</span></a></div>`}
function renderApps(){return `<p class="eyebrow">${esc(t("statusLine"))}</p><h1 class="page-title">${esc(t("apps"))}</h1><p class="page-subtitle">${esc(t("homeIntro"))}</p><div class="list">${APPS.map(x=>listItem(x,`#/app/${x.id}`)).join("")}</div>`}
function renderSettings(){return `<p class="eyebrow">${esc(t("statusLine"))}</p><h1 class="page-title">${esc(t("settings"))}</h1><p class="page-subtitle">${esc(t("homeIntro"))}</p><section class="panel"><div class="setting-row"><div><div class="setting-label">${esc(t("chooseLanguage"))}</div></div><div class="segmented" role="group" aria-label="${esc(t("chooseLanguage"))}">${[["ja","日"],["en","英"],["nu","砮"]].map(([code,label])=>`<button type="button" data-lang="${code}" aria-pressed="${lang===code}">${label}</button>`).join("")}</div></div><div class="setting-row"><div><div class="setting-label">${esc(t("theme"))}</div><div class="setting-hint">${esc(t("themeHint"))}</div></div><div class="segmented" role="group" aria-label="${esc(t("theme"))}"><button type="button" data-theme-choice="dark" aria-pressed="${theme==="dark"}">${esc(t("dark"))}</button><button type="button" data-theme-choice="light" aria-pressed="${theme==="light"}">${esc(t("light"))}</button></div></div></section><div class="section-head"><h2>${esc(t("data"))}</h2></div><section class="panel"><div class="setting-row"><div><div class="setting-label">${esc(t("resetTitle"))}</div><div class="setting-hint">${esc(t("dataHint"))}</div></div><button type="button" class="danger" id="resetButton">${esc(t("resetData"))}</button></div></section>`}
function renderGames(){return `<a class="backlink" href="#/apps">‹ ${esc(t("back"))}</a><p class="eyebrow">${esc(t("games"))}</p><h1 class="page-title">${esc(t("games"))}</h1><p class="page-subtitle">${esc(t("gamesIntro"))}</p><div class="list">${GAME_ITEMS.map(x=>listItem(x,`#/game/${x.id}`)).join("")}</div>`}
function renderTranslate(){return placeholder("translate","translateComing")}
function renderDictionary(){return placeholder("dictionary","dictionaryComing")}
function placeholder(titleKey,messageKey){return `<a class="backlink" href="#/apps">‹ ${esc(t("back"))}</a><p class="eyebrow">${esc(t("statusLine"))}</p><h1 class="page-title">${esc(t(titleKey))}</h1><section class="empty-state"><div class="empty-icon" aria-hidden="true">◌</div><h2>${esc(t("comingSoon"))}</h2><p>${esc(t(messageKey))}</p></section>`}
function renderAI(){return `<a class="backlink" href="#/apps">‹ ${esc(t("back"))}</a><p class="eyebrow">${esc(t("ai"))}</p><h1 class="page-title">${esc(t("ai"))}</h1><section class="empty-state"><div class="empty-icon" aria-hidden="true">✧</div><h2>${esc(t("ai"))}</h2><p>${esc(t("aiIntro"))}</p><a class="primary-link" href="${esc(AI_URL)}" target="_blank" rel="noopener noreferrer">${esc(t("openAI"))} ↗</a><p class="footnote">${esc(t("externalNote"))}</p></section>`}
function renderClock(){return `<a class="backlink" href="#/apps">‹ ${esc(t("back"))}</a><p class="eyebrow">${esc(t("clock"))}</p><h1 class="page-title">${esc(t("clock"))}</h1><p class="page-subtitle">${esc(t("clockIntro"))}</p><section class="clock-panel"><p class="eyebrow">${esc(t("now"))}</p><div class="clock-time" data-clock>--:--</div><div class="clock-date" data-date>—</div></section>`}
function renderGameStub(id){const item=GAME_ITEMS.find(x=>x.id===id);if(!item)return renderNotFound();return `<a class="backlink" href="#/app/games">‹ ${esc(t("back"))}</a><p class="eyebrow">${esc(t("games"))}</p><h1 class="page-title">${esc(t(item.nameKey))}</h1><section class="empty-state"><div class="empty-icon" aria-hidden="true">${item.icon}</div><h2>${esc(t("comingSoon"))}</h2><p>${esc(t("gameStub"))}</p></section>`}
function renderNotFound(){return `<a class="backlink" href="#/home">‹ ${esc(t("home"))}</a><section class="empty-state"><h2>${esc(t("stubTitle"))}</h2><p>${esc(t("stubText"))}</p></section>`}
function route(){const raw=location.hash.replace(/^#\/?/,"");const parts=raw.split("/").filter(Boolean);if(!parts.length||parts[0]==="home")return {kind:"screen",render:renderHome,nav:"home"};if(parts[0]==="apps")return {kind:"screen",render:renderApps,nav:"apps"};if(parts[0]==="settings")return {kind:"screen",render:renderSettings,nav:"settings"};if(parts[0]==="game")return {kind:"screen",render:()=>renderGameStub(parts[1]),nav:"apps"};if(parts[0]==="app"){const item=APPS.find(x=>x.id===parts[1]);return item?{kind:"app",item,nav:"apps"}:{kind:"screen",render:renderNotFound,nav:"apps"}}return {kind:"screen",render:renderNotFound,nav:"home"}}
function updateClock(){const now=new Date();document.querySelectorAll("[data-clock]").forEach(el=>el.textContent=now.toLocaleTimeString(locale(),{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}));document.querySelectorAll("[data-date]").forEach(el=>el.textContent=now.toLocaleDateString(locale(),{weekday:"long",year:"numeric",month:"long",day:"numeric"}))}
function drawNav(active){nav.setAttribute("aria-label",t("mainNavigation"));const entries=[["home","home","⌂"],["apps","apps","▦"],["settings","settings","⚙"]];nav.innerHTML=entries.map(([id,key,icon])=>`<a class="navlink" href="#/${id}" ${active===id?'aria-current="page"':""}><span class="navicon" aria-hidden="true">${icon}</span><span>${esc(t(key))}</span></a>`).join("")}
function applyLanguage(){document.documentElement.lang=lang;document.title=t("appTitle");document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute("content",t("appTitle"));document.querySelector(".phone").setAttribute("aria-label",t("appTitle"));document.querySelector(".brand").setAttribute("aria-label",t("appTitle"));document.getElementById("brandName").textContent=t("appTitle");document.querySelectorAll(".lang").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));document.querySelector(".languages").setAttribute("aria-label",t("languageNav"))}
function render(){applyLanguage();const r=route();app.innerHTML=r.kind==="app"?r.item.render():r.render();applyBrandIcons();drawNav(r.nav);updateClock();const reset=document.getElementById("resetButton");if(reset)reset.addEventListener("click",()=>{if(window.confirm(t("resetConfirm"))){lang="ja";theme="dark";try{localStorage.removeItem(LANG_KEY);localStorage.removeItem(THEME_KEY)}catch(_){ }document.documentElement.dataset.theme=theme;render();window.alert(t("resetDone"))}})}
function setLanguage(next){if(!["ja","en","nu"].includes(next))return;lang=next;try{localStorage.setItem(LANG_KEY,lang)}catch(_){ }render()}
function setTheme(next){if(!["dark","light"].includes(next))return;theme=next;document.documentElement.dataset.theme=theme;try{localStorage.setItem(THEME_KEY,theme)}catch(_){ }render()}
document.documentElement.dataset.theme=theme;
document.addEventListener("click",event=>{const l=event.target.closest("[data-lang]");if(l){setLanguage(l.dataset.lang);return}const th=event.target.closest("[data-theme-choice]");if(th)setTheme(th.dataset.themeChoice)});
window.addEventListener("hashchange",render);
if(!location.hash)location.hash="#/home";else render();
setInterval(updateClock,1000);
</script>
</body>
</html>
