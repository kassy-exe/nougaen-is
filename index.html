  g.fillStyle=s.doorOpen?"#ffedb0":"#54677f";
  g.fillRect(AR_W/2-36,13,72,4);
  if(!s.doorOpen){g.fillStyle="#1d2c44";for(let i=0;i<4;i++)g.fillRect(AR_W/2-31+i*17,1,8,15)}
  else{g.fillStyle="#7a5a12";g.font="bold 11px sans-serif";g.textAlign="center";g.fillText("OPEN",AR_W/2,12)}
  // obstacles
  for(const o of s.obs){
    g.fillStyle="#4b6076";g.fillRect(o.x,o.y,o.w,o.h);
    g.fillStyle="#5f7791";g.fillRect(o.x,o.y,o.w,7);
    g.strokeStyle="#7d92b2";g.lineWidth=2;g.strokeRect(o.x,o.y,o.w,o.h);
    g.strokeStyle="rgba(20,30,46,.5)";g.lineWidth=1;
    g.beginPath();g.moveTo(o.x+5,o.y+o.h-5);g.lineTo(o.x+o.w-12,o.y+10);g.stroke();
  }
  // gems
  for(const gm of s.gems){
    const gs=(gm.v>=2?7:5.2)*(1+0.18*Math.sin(s.time*7+gm.x*0.7+gm.y));
    g.fillStyle=gm.v>=2?"#ffd94d":"#39d5e8";

    g.fillStyle="#ff5d47";g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fill();
  }
  // arrows
  for(const a of s.arrows){
    const ang=Math.atan2(a.vy,a.vx);
    g.save();g.translate(a.x,a.y);g.rotate(ang);
    g.strokeStyle="#8a5a1e";g.lineWidth=2.4;
    g.beginPath();g.moveTo(-10,0);g.lineTo(5,0);g.stroke();
    g.fillStyle="#e8e4da";
    g.beginPath();g.moveTo(11,0);g.lineTo(4,-3);g.lineTo(4,3);g.closePath();g.fill();
    g.fillStyle="#e0483e";
    g.beginPath();g.moveTo(-10,0);g.lineTo(-14,-3.4);g.lineTo(-12.6,0);g.lineTo(-14,3.4);g.closePath();g.fill();
    g.restore();
  }
  // enemies then player
  for(const e of s.enemies)arDrawEnemy(g,s,e);
  arDrawPlayer(g,s);
  // particles
  for(const pt of s.parts){
    g.globalAlpha=Math.max(0,pt.life/pt.max);
    g.fillStyle=pt.color;
    g.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size);
  }
  g.globalAlpha=1;
  // damage texts
  g.textAlign="center";
  for(const tx of s.texts){
    g.globalAlpha=Math.min(1,tx.life/0.3);
    g.font="bold "+tx.size+"px sans-serif";
    g.fillStyle=tx.color;
    g.fillText(tx.text,tx.x,tx.y);
  }
  g.globalAlpha=1;
  // joystick
  if(s.joy.active){

    g.beginPath();g.arc(s.joy.ox,s.joy.oy,42,0,Math.PI*2);g.stroke();

    g.beginPath();g.arc(s.joy.cx,s.joy.cy,17,0,Math.PI*2);g.fill();
  }
}

function filterGrid(id,q){const g=document.getElementById(id);if(!g)return;q=q.trim().toLowerCase();[...g.children].forEach(c=>{c.style.display=!q||c.textContent.toLowerCase().includes(q)?"":"none"})}
document.getElementById("drawerHandle").addEventListener("click",closeDrawer);
document.getElementById("searchBack").addEventListener("click",closeSearch);
document.getElementById("drawerInput").addEventListener("input",e=>filterGrid("drawerGrid",e.target.value));
document.getElementById("searchInput").addEventListener("input",e=>{filterGrid("searchGrid",e.target.value);const ask=document.getElementById("searchAsk");const q=e.target.value.trim();ask.hidden=!q;if(q)document.getElementById("searchAskText").textContent=t("ai")+" · "+q});
document.getElementById("searchAsk").addEventListener("click",()=>{const q=document.getElementById("searchInput").value.trim();if(!q)return;try{localStorage.setItem("nougaen-is-ai-prefill",q)}catch(_){}closeSearch();location.hash="#/app/ai"});
app.addEventListener("click",e=>{const s=e.target.closest("[data-opensearch]");if(s){e.preventDefault();openSearch()}});
window.addEventListener("hashchange",()=>{closeDrawer();closeSearch();closeRecents()});
let tsy=null;
document.addEventListener("touchstart",e=>{tsy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{if(tsy===null)return;const dy=e.changedTouches[0].clientY-tsy;tsy=null;const dr=document.getElementById("drawer"),so=document.getElementById("searchOv");const ro=document.getElementById("recentsOv");if(ro&&ro.classList.contains("open")){if(dy>60)closeRecents();return}if(so&&so.classList.contains("open")){if(dy>60)closeSearch();return}if(dr&&dr.classList.contains("open")){if(dy>60)closeDrawer();return}const ph=document.querySelector(".phone");if(ph&&ph.classList.contains("home-mode")&&dy<-60)openDrawer()},{passive:true});
let psy=null;
document.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")psy=e.clientY},{passive:true});
document.addEventListener("pointerup",e=>{if(e.pointerType!=="mouse"||psy===null)return;const dy=e.clientY-psy;psy=null;const dr=document.getElementById("drawer"),so=document.getElementById("searchOv"),ro=document.getElementById("recentsOv");if(ro&&ro.classList.contains("open")){if(dy>60)closeRecents();return}if(so&&so.classList.contains("open")){if(dy>60)closeSearch();return}if(dr&&dr.classList.contains("open")){if(dy>60)closeDrawer();return}const ph=document.querySelector(".phone");if(ph&&ph.classList.contains("home-mode")&&dy<-60)openDrawer()},{passive:true});
let wheelCool=0;
document.addEventListener("wheel",e=>{const now=Date.now();if(now<wheelCool)return;const ph=document.querySelector(".phone");const dr=document.getElementById("drawer");if(ph&&ph.classList.contains("home-mode")&&dr&&!dr.classList.contains("open")&&e.deltaY>30){wheelCool=now+700;openDrawer()}},{passive:true});
const REC_KEY="nougaen-is-recents";
function loadRecents(){try{return JSON.parse(localStorage.getItem(REC_KEY)||"[]")}catch(_){return[]}}
function saveRecents(l){try{localStorage.setItem(REC_KEY,JSON.stringify(l))}catch(_){}}
function trackRecent(){const m=location.hash.match(/^#\/(app|game|userapp)\/([a-z0-9-]+)$/);if(!m)return;let e=null;if(m[1]==="userapp"){const u=loadUserApps().find(x=>x.id===m[2]);if(!u)return;e={href:location.hash,icon:u.icon,name:u.name,color:u.color||"#5f7adb"}}else{const item=(m[1]==="app"?APPS:GAME_ITEMS).find(x=>x.id===m[2]);if(!item)return;e={href:location.hash,icon:item.icon,nameKey:item.nameKey,color:APP_COLORS[item.id]||"#7c4dff"}}const l=loadRecents().filter(x=>x.href!==e.href);l.unshift(e);saveRecents(l.slice(0,12))}
function buildRecents(){const list=document.getElementById("recList");if(!list)return;document.getElementById("recentsTitle").textContent=t("recents");const cb=document.getElementById("recClear");cb.textContent=t("kbClear");const l=loadRecents();cb.style.display=l.length?"":"none";list.innerHTML=l.length?l.map(e=>`<div class="rec-card"><div class="rec-head"><span class="rec-ic" style="--ic:${e.color}">${esc(e.icon)}</span><span class="rec-name">${esc(e.name||t(e.nameKey))}</span><button type="button" class="rec-x" data-rec-x="${esc(e.href)}" aria-label="Close">✕</button></div><a class="rec-prev" href="${esc(e.href)}" aria-label="${esc(e.name||t(e.nameKey))}"><span style="--ic:${e.color}">${esc(e.icon)}</span></a></div>`).join(""):`<p class="rec-empty">${esc(t("recentsEmpty"))}</p>`}
function openRecents(){buildRecents();const o=document.getElementById("recentsOv");if(o){o.classList.add("open");o.setAttribute("aria-hidden","false")}}
function closeRecents(){const o=document.getElementById("recentsOv");if(o){o.classList.remove("open");o.setAttribute("aria-hidden","true")}}
document.getElementById("recentsHandle").addEventListener("click",closeRecents);
document.getElementById("recClear").addEventListener("click",()=>{saveRecents([]);buildRecents()});
document.getElementById("recList").addEventListener("click",e=>{const x=e.target.closest("[data-rec-x]");if(x){e.preventDefault();saveRecents(loadRecents().filter(r=>r.href!==x.dataset.recX));buildRecents()}});
/* ===== user apps, home layout, app generator ===== */
const UA_KEY="nougaen-is-userapps",HL_KEY="nougaen-is-home-layout",AG_KEY="nougaen-is-appgen";
function loadUserApps(){try{return JSON.parse(localStorage.getItem(UA_KEY)||"[]")}catch(_){return[]}}
function saveUserApps(l){try{localStorage.setItem(UA_KEY,JSON.stringify(l))}catch(_){}}
function userAppItem(u){return {id:u.id,icon:u.icon,name:u.name,href:"#/userapp/"+u.id,color:u.color||"#5f7adb",user:true}}
function allApps(){return APPS.concat(loadUserApps().map(userAppItem))}
function loadLayout(){try{const l=JSON.parse(localStorage.getItem(HL_KEY)||"null");return l&&Array.isArray(l.order)?l:{order:[],hidden:[]}}catch(_){return{order:[],hidden:[]}}}
function saveLayout(l){try{localStorage.setItem(HL_KEY,JSON.stringify(l))}catch(_){}}
function orderedApps(){const items=allApps(),lay=loadLayout(),byId={};items.forEach(x=>byId[x.id]=x);const out=[];lay.order.forEach(id=>{if(byId[id]){out.push(byId[id]);delete byId[id]}});items.forEach(x=>{if(byId[x.id])out.push(x)});return out}
function homeApps(){const lay=loadLayout();return orderedApps().filter(x=>!lay.hidden.includes(x.id))}
function escAttr(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;")}
function renderUserApp(u){return `<div class="ua-full"><iframe class="ua-frame2" title="${esc(u.name)}" sandbox="allow-scripts allow-modals" srcdoc="${escAttr(u.html)}"></iframe></div>`}
function renderCustomize(){const lay=loadLayout(),ordered=orderedApps();return `<h1 class="page-title">${esc(t("customize"))}</h1><p class="page-subtitle">${esc(t("custHint"))}</p><div class="cust-list">${ordered.map((x,i)=>{const hid=lay.hidden.includes(x.id);return `<div class="cust-row${hid?" off":""}"><span class="rec-ic" style="--ic:${x.color||APP_COLORS[x.id]||"#5f7adb"}">${esc(x.icon)}</span><span class="cust-name">${esc(x.name||t(x.nameKey))}</span><button type="button" class="cust-btn" data-cust="up" data-id="${x.id}" ${i===0?"disabled":""}>↑</button><button type="button" class="cust-btn" data-cust="down" data-id="${x.id}" ${i===ordered.length-1?"disabled":""}>↓</button><button type="button" class="cust-btn" data-cust="toggle" data-id="${x.id}">${esc(t(hid?"visShow":"visHide"))}</button>${x.user?`<button type="button" class="cust-btn danger2" data-cust="del" data-id="${x.id}">${esc(t("uaDelete"))}</button>`:""}</div>`}).join("")}</div>`}
function custAction(btn){const id=btn.dataset.id,act=btn.dataset.cust,lay=loadLayout();let order=orderedApps().map(x=>x.id);
 if(act==="toggle"){lay.hidden=lay.hidden.includes(id)?lay.hidden.filter(x=>x!==id):lay.hidden.concat([id])}
 if(act==="up"||act==="down"){const i=order.indexOf(id),j=act==="up"?i-1:i+1;if(i>=0&&j>=0&&j<order.length){const tmp=order[i];order[i]=order[j];order[j]=tmp}}
 if(act==="del"){saveUserApps(loadUserApps().filter(u=>u.id!==id));order=order.filter(x=>x!==id);lay.hidden=lay.hidden.filter(x=>x!==id);saveRecents(loadRecents().filter(r=>r.href!=="#/userapp/"+id))}
 lay.order=order;saveLayout(lay);render()}
const AG_PROMPT="You are an app builder embedded in a phone-like web OS. The user describes an app or a change in chat (mostly Japanese). Reply in the user's language: first a brief friendly explanation of what you built or changed (a few lines, no code in the prose), then the COMPLETE app as one single self-contained HTML file inside a single ```html code block. Rules: one HTML file only, all CSS and JS inline, no external files, CDNs or network calls; mobile-first, must work nicely in a small iframe about 380px wide; include a <title> with the app name; make it genuinely functional (real logic, buttons that work), not a mockup; keep it reasonably compact. When the user asks for a change, return the FULL updated HTML file, never a diff or partial snippet.";
let agState={html:"",name:"",busy:false,msgs:[]};
try{const s=JSON.parse(localStorage.getItem(AG_KEY)||"null");if(s&&Array.isArray(s.msgs))agState={html:s.html||"",name:s.name||"",busy:false,msgs:s.msgs}}catch(_){}
function agSave(){try{localStorage.setItem(AG_KEY,JSON.stringify({html:agState.html,name:agState.name,msgs:agState.msgs.slice(-16)}))}catch(_){}}
function agExtract(text){const m=text.match(/```html\s*([\s\S]*?)```/)||text.match(/```\s*([\s\S]*?)```/);return m?m[1].trim():null}
function agBubble(m){return `<div class="ai-msg ${m.who==="me"?"me":"ai"}">${esc(m.text)}</div>`}
function renderAppgen(){return `<div class="ag"><div class="ag-preview">${agState.html?`<iframe id="agFrame" class="ag-frame" sandbox="allow-scripts allow-modals" srcdoc="${escAttr(agState.html)}"></iframe>`:`<div class="ag-empty">${esc(t("agEmpty"))}</div>`}</div><div class="ag-install"><input id="agName" class="ag-name" type="text" maxlength="24" placeholder="${esc(t("agNamePh"))}" value="${esc(agState.name)}"><button type="button" class="ag-btn" data-ag="install" ${agState.html?"":"disabled"}>${esc(t("agInstall"))}</button><button type="button" class="ag-btn ghost" data-ag="reset">${esc(t("agReset"))}</button></div><div class="ag-msgs" id="agMsgs">${agState.msgs.map(agBubble).join("")}</div><div class="ag-inputrow"><textarea id="agInput" class="ai-input" rows="2" placeholder="${esc(t("agPh"))}"></textarea><button type="button" class="ag-btn" data-ag="send">${esc(t("aiSend"))}</button></div></div>`}
function agPaintMsgs(){const el=document.getElementById("agMsgs");if(!el)return;el.innerHTML=agState.msgs.map(agBubble).join("");el.scrollTop=el.scrollHeight}
function agPaint(){const box=document.querySelector(".ag-preview");if(box){if(agState.html){let f=document.getElementById("agFrame");if(!f){box.innerHTML="";f=document.createElement("iframe");f.id="agFrame";f.className="ag-frame";f.setAttribute("sandbox","allow-scripts allow-modals");box.appendChild(f)}f.srcdoc=agState.html}else{box.innerHTML=`<div class="ag-empty">${esc(t("agEmpty"))}</div>`}}
 const ib=document.querySelector("[data-ag='install']");if(ib)ib.disabled=!agState.html;const nm=document.getElementById("agName");if(nm&&document.activeElement!==nm)nm.value=agState.name;agPaintMsgs()}
async function agSend(){if(agState.busy)return;const ta=document.getElementById("agInput"),text=(ta?ta.value:"").trim().slice(0,3000);if(!text)return;const proxy=aiGetProxy(),keyInfo=aiGetKey();if(!proxy&&!keyInfo.key){agState.msgs.push({who:"ai",text:t("aiNeedSetup")});agSave();agPaintMsgs();return}
 ta.value="";agState.busy=true;agState.msgs.push({who:"me",text});
 const hist=agState.msgs.slice(-20).map(m=>({role:m.who==="me"?"user":"model",parts:[{text:m.full||m.text}]}));
 agState.msgs.push({who:"ai",text:"…"});agSave();agPaintMsgs();
 const body={contents:hist,systemInstruction:{parts:[{text:AG_PROMPT+(agState.html?"\n\nThe current app HTML is:\n"+agState.html.slice(0,24000):"")}]}};
 try{const d=await aiFetchJson(body,fb=>{agState.msgs[agState.msgs.length-1]={who:"ai",text:t(fb?"aiFallback":"aiRetry")};agPaintMsgs()});const answer=d?.candidates?.[0]?.content?.parts?.map(pp=>pp.text||"").join("")||"";
  if(!answer)throw new Error("empty response");
  const code=agExtract(answer);let display=answer.replace(/```html\s*[\s\S]*?```/," ").replace(/```[\s\S]*?```/," ").trim();
  if(code){agState.html=code;const tm=code.match(/<title>([^<]{1,40})<\/title>/i);if(tm&&!agState.name)agState.name=tm[1].trim();display=(display?display+"\n":"")+t("agUpdated")}
  agState.msgs[agState.msgs.length-1]={who:"ai",text:display||"…",full:answer};aiBumpUsage(d?.usageMetadata?.totalTokenCount);
 }catch(e){agState.msgs[agState.msgs.length-1]={who:"ai",text:t("aiError")+": "+(e?.message||String(e))}}
 agState.busy=false;agSave();agPaint()}
function agAction(btn){const a=btn.dataset.ag;
 if(a==="reset"){if(!window.confirm(t("agResetConfirm")))return;agState={html:"",name:"",busy:false,msgs:[]};agSave();render();return}
 if(a==="send"){agSend();return}
 if(a==="install"){if(!agState.html)return;const name=((document.getElementById("agName")||{}).value||"").trim()||agState.name||"App";const colors=["#ef5350","#ab47bc","#5c6bc0","#29b6f6","#26a69a","#9ccc65","#ffa726","#ec407a"];const u={id:"u"+Date.now().toString(36),name,icon:name.slice(0,1)||"A",html:agState.html,color:colors[loadUserApps().length%colors.length]};const l=loadUserApps();l.push(u);saveUserApps(l);fillOverlays();agState.msgs.push({who:"ai",text:t("agInstalled")+"： "+name});agSave();agPaintMsgs()}}
app.addEventListener("click",e=>{const c=e.target.closest("[data-cust]");if(c){custAction(c);return}const g=e.target.closest("[data-ag]");if(g)agAction(g)});
app.addEventListener("keydown",e=>{if(e.target.id==="agInput"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();agSend()}});


document.addEventListener("click",event=>{const l=event.target.closest("[data-lang]");if(l){setLanguage(l.dataset.lang);return}const th=event.target.closest("[data-theme-choice]");if(th)setTheme(th.dataset.themeChoice)});
window.addEventListener("hashchange",render);
if(!location.hash)location.hash="#/home";else render();
setInterval(updateClock,1000);
</script>
